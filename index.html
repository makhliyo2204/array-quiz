затель проверяют на nullptr."}, {"l": 17, "k": "theory", "q": "На сколько сдвигается адрес при выполнении p + 1 для указателя int* p?", "o": ["На один элемент типа int", "Ровно на 1 байт", "На размер всего массива", "Адрес не изменяется"], "e": "Арифметика указателей считает в элементах, а не в байтах."}, {"l": 17, "k": "theory", "q": "Что означает объявление const int* p?", "o": ["Через p нельзя изменять значение, на которое он указывает", "Нельзя переназначить сам указатель p", "Указатель p всегда равен nullptr", "p указывает только на константу 0"], "e": "int* const p - наоборот: нельзя переназначить сам указатель."}, {"l": 17, "k": "theory", "q": "Что такое «висячий» указатель (dangling pointer)?", "o": ["Указатель на память, которая уже освобождена или больше не существует", "Указатель, равный nullptr", "Указатель на константу", "Указатель на первый элемент массива"], "e": "Обращение по такому указателю - опасная ошибка."}, {"l": 17, "k": "code", "q": "Какой фрагмент компилируется и изменяет x через указатель (выводит 20)?", "o": ["int x = 10;\nint* p = &x;\n*p = 20;\ncout << x;", "int x = 10;\nint* p = x;\n*p = 20;\ncout << x;", "int x = 10;\nint* p = &x;\np = 20;\ncout << x;", "int x = 10;\nint p = &x;\n*p = 20;\ncout << x;"], "e": "В указатель записывают адрес &x; значение изменяют через разыменование *p; тип указателя - int*."}, {"l": 17, "k": "code", "q": "Какой фрагмент выводит значение переменной, увеличенное на 1 (8)?", "o": ["int x = 7;\nint* p = &x;\ncout << *p + 1;", "int x = 7;\nint* p = &x;\ncout << p + 1;", "int x = 7;\nint* p = &x;\ncout << &p + 1;", "int x = 7;\nint* p;\ncout << *p + 1;"], "e": "Без разыменования выводится адрес; &p - адрес самого указателя; неинициализированный указатель разыменовывать нельзя."}, {"l": 17, "k": "code", "q": "Какой фрагмент компилируется и безопасно работает с пустым указателем (выводит empty)?", "o": ["int* p = nullptr;\nif (p != nullptr) cout << *p;\nelse cout << \"empty\";", "int* p = nullptr;\nif (p == nullptr) cout << *p;\nelse cout << \"empty\";", "int* p = nullptr;\ncout << *p;", "int* p = null;\nif (p != nullptr) cout << *p;\nelse cout << \"empty\";"], "e": "Разыменовывать можно только ненулевой указатель; литерал называется nullptr."}, {"l": 17, "k": "code", "q": "Какой фрагмент компилируется и находит сумму элементов через указатель (14)?", "o": ["int a[4] = {5, 2, 3, 4};\nint* p = a;\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += *(p + i);\ncout << sum;", "int a[4] = {5, 2, 3, 4};\nint* p = a;\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += *p + i;\ncout << sum;", "int a[4] = {5, 2, 3, 4};\nint* p = &a;\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += *(p + i);\ncout << sum;", "int a[4] = {5, 2, 3, 4};\nint* p = a;\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += (p + i);\ncout << sum;"], "e": "*(p + i) - это элемент a[i]; *p + i прибавляет i к первому элементу; имя массива уже является адресом первого элемента."}, {"l": 17, "k": "code", "q": "Какой фрагмент компилируется и правильно проходит по массиву указателем (выводит 456)?", "o": ["int a[3] = {4, 5, 6};\nfor (int* p = a; p < a + 3; p++) cout << *p;", "int a[3] = {4, 5, 6};\nfor (int* p = a; p <= a + 3; p++) cout << *p;", "int a[3] = {4, 5, 6};\nfor (int* p = a; p < a + 3; p++) cout << p;", "int a[3] = {4, 5, 6};\nfor (int p = a; p < a + 3; p++) cout << *p;"], "e": "Адрес a + 3 находится уже за массивом; для вывода значения нужно разыменование; тип переменной - int*."}, {"l": 17, "k": "code", "q": "Какая программа компилируется и меняет значения переменных местами (выводит 21)?", "o": ["void swapValues(int* a, int* b) {\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint main() {\n    int x = 1, y = 2;\n    swapValues(&x, &y);\n    cout << x << y;\n    return 0;\n}", "void swapValues(int* a, int* b) {\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint main() {\n    int x = 1, y = 2;\n    swapValues(x, y);\n    cout << x << y;\n    return 0;\n}", "void swapValues(int* a, int* b) {\n    int* t = a;\n    a = b;\n    b = t;\n}\n\nint main() {\n    int x = 1, y = 2;\n    swapValues(&x, &y);\n    cout << x << y;\n    return 0;\n}", "void swapValues(int a, int b) {\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint main() {\n    int x = 1, y = 2;\n    swapValues(&x, &y);\n    cout << x << y;\n    return 0;\n}"], "e": "В функцию передают адреса; менять нужно значения по адресам (*a, *b), а не локальные копии указателей."}, {"l": 17, "k": "code", "q": "Какая программа компилируется и правильно находит сумму массива в функции (6)?", "o": ["int sum(int* a, int n) {\n    int s = 0;\n    for (int i = 0; i < n; i++) s += a[i];\n    return s;\n}\n\nint main() {\n    int a[3] = {1, 2, 3};\n    cout << sum(a, 3);\n    return 0;\n}", "int sum(int* a, int n) {\n    int s = 0;\n    for (int i = 0; i < n; i++) s += a[i];\n    return s;\n}\n\nint main() {\n    int a[3] = {1, 2, 3};\n    cout << sum(a);\n    return 0;\n}", "int sum(int* a, int n) {\n    int s = 0;\n    for (int i = 0; i < n; i++) s += a[i];\n    return s;\n}\n\nint main() {\n    int a[3] = {1, 2, 3};\n    cout << sum(&a, 3);\n    return 0;\n}", "int sum(int* a, int n) {\n    int s = 0;\n    for (int i = 0; i < sizeof(a) / sizeof(a[0]); i++) s += a[i];\n    return s;\n}\n\nint main() {\n    int a[3] = {1, 2, 3};\n    cout << sum(a, 3);\n    return 0;\n}"], "e": "При передаче в функцию массив превращается в указатель и теряет размер, поэтому n передают отдельно; sizeof(a) внутри функции - размер указателя."}, {"l": 17, "k": "code", "q": "Какой фрагмент с указателем на константу компилируется (выводит 9)?", "o": ["int x = 5, y = 9;\nconst int* p = &x;\np = &y;\ncout << *p;", "int x = 5, y = 9;\nconst int* p = &x;\n*p = y;\ncout << *p;", "int x = 5, y = 9;\nint* const p = &x;\np = &y;\ncout << *p;", "int x = 5, y = 9;\nconst int* const p = &x;\np = &y;\ncout << *p;"], "e": "const int* p запрещает менять значение через p, но разрешает переназначить p; int* const p запрещает переназначение."}, {"l": 17, "k": "code", "q": "Какой фрагмент компилируется и правильно работает с динамической переменной (выводит 6)?", "o": ["int* p = new int(5);\n*p += 1;\ncout << *p;\ndelete p;", "int* p = new int[5];\n*p += 1;\ncout << *p;\ndelete p;", "int p = new int(5);\n*p += 1;\ncout << *p;\ndelete p;", "int* p = new int(5);\n*p += 1;\ncout << *p;\ndelete *p;"], "e": "new int(5) создаёт одно число со значением 5, new int[5] - массив из 5 чисел без значений; new возвращает указатель; delete применяют к указателю."}, {"l": 17, "k": "code", "q": "Какой фрагмент компилируется и правильно работает с динамическим массивом (выводит 4)?", "o": ["int n = 3;\nint* a = new int[n];\nfor (int i = 0; i < n; i++) a[i] = i * i;\ncout << a[2];\ndelete[] a;", "int n = 3;\nint* a = new int[];\nfor (int i = 0; i < n; i++) a[i] = i * i;\ncout << a[2];\ndelete[] a;", "int n = 3;\nint a = new int[n];\nfor (int i = 0; i < n; i++) a[i] = i * i;\ncout << a[2];\ndelete[] a;", "int n = 3;\nint* a = new int[n];\nfor (int i = 0; i < n; i++) a[i] = i * i;\ndelete[] a;\ncout << a[2];"], "e": "Массив создают через new int[n] с указанием размера и освобождают через delete[]; после освобождения памяти обращаться к ней нельзя."}, {"l": 17, "k": "code", "q": "Какой фрагмент с умным указателем компилируется (выводит 42)?", "o": ["unique_ptr<int> p = make_unique<int>(42);\ncout << *p;", "unique_ptr<int> p = 42;\ncout << *p;", "unique_ptr<int> p = make_unique<int>(42);\nunique_ptr<int> q = p;\ncout << *q;", "unique_ptr<int> p = make_unique(42);\ncout << *p;"], "e": "unique_ptr создают через make_unique<тип>(значение); его нельзя копировать - владелец у памяти один."}, {"l": 17, "k": "code", "q": "Какая программа компилируется и увеличивает переменную через ссылку (выводит 6)?", "o": ["void inc(int& v) {\n    v++;\n}\n\nint main() {\n    int x = 5;\n    inc(x);\n    cout << x;\n    return 0;\n}", "void inc(int v) {\n    v++;\n}\n\nint main() {\n    int x = 5;\n    inc(x);\n    cout << x;\n    return 0;\n}", "void inc(int& v) {\n    v++;\n}\n\nint main() {\n    int x = 5;\n    inc(&x);\n    cout << x;\n    return 0;\n}", "void inc(int& v) {\n    v++;\n}\n\nint main() {\n    int x = 5;\n    inc(5);\n    cout << x;\n    return 0;\n}"], "e": "Без & функция изменяет копию; в параметр-ссылку передают саму переменную, а не адрес и не литерал."}, {"l": 17, "k": "code", "q": "Какой фрагмент компилируется и правильно обращается к двумерному массиву через указатель (выводит 6)?", "o": ["int m[2][3] = {{1, 2, 3}, {4, 5, 6}};\nint (*row)[3] = m;\ncout << row[1][2];", "int m[2][3] = {{1, 2, 3}, {4, 5, 6}};\nint* row[3] = m;\ncout << row[1][2];", "int m[2][3] = {{1, 2, 3}, {4, 5, 6}};\nint** row = m;\ncout << row[1][2];", "int m[2][3] = {{1, 2, 3}, {4, 5, 6}};\nint (*row)[3] = m;\ncout << row[2][1];"], "e": "Имя двумерного массива - указатель на строку из трёх int: int (*row)[3]; индексы: сначала строка (0-1), затем столбец (0-2)."}, {"l": 17, "k": "out", "q": "Что выведет этот код?", "o": ["20 40 30", "10 30 20", "20 30 40", "20 40 20"], "e": "p указывает на a[1]; p + 2 - это a[3]; p[1] - это a[2].", "c": "int a[4] = {10, 20, 30, 40};\nint* p = a + 1;\ncout << *p << \" \" << *(p + 2) << \" \" << p[1];"}, {"l": 17, "k": "out", "q": "Что выведет этот код?", "o": ["88", "38", "83", "33"], "e": "Оба указателя хранят адрес одной переменной x.", "c": "int x = 3;\nint* p = &x;\nint* q = p;\n*q = 8;\ncout << x << *p;"}, {"l": 17, "k": "out", "q": "Что выведет этот код?", "o": ["507", "067", "560", "607"], "e": "После p++ указатель смотрит на a[1].", "c": "int a[3] = {5, 6, 7};\nint* p = a;\np++;\n*p = 0;\ncout << a[0] << a[1] << a[2];"}, {"l": 17, "k": "out", "q": "Что выведет этот код?", "o": ["9", "8", "4", "5"], "e": "Ссылка r и указатель p работают с одной и той же переменной x: 4 * 2 + 1.", "c": "int x = 4;\nint& r = x;\nr *= 2;\nint* p = &r;\n(*p)++;\ncout << x;"}, {"l": 17, "k": "out", "q": "Что выведет этот код?", "o": ["3 3", "3 4", "4 3", "12 3"], "e": "Разность указателей - количество элементов между ними (3); разность значений 5 - 2 = 3.", "c": "int a[5] = {1, 2, 3, 4, 5};\nint* p = a + 4;\nint* q = a + 1;\ncout << p - q << \" \" << *p - *q;"}, {"l": 17, "k": "out", "q": "Что выведет этот код?", "o": ["25", "15", "52", "55"], "e": "Сначала x получает 2, затем указатель переназначен на y, и y получает 5.", "c": "int x = 1, y = 2;\nint* p = &x;\n*p = y;\np = &y;\n*p = 5;\ncout << x << y;"}, {"l": 17, "k": "out", "q": "Что выведет этот код?", "o": ["11 1", "11 11", "1 11", "1 1"], "e": "f изменяет переменную по адресу, g изменяет только свою копию.", "c": "void f(int* p) {\n    *p += 10;\n}\n\nvoid g(int v) {\n    v += 10;\n}\n\nint main() {\n    int a = 1, b = 1;\n    f(&a);\n    g(b);\n    cout << a << \" \" << b;\n    return 0;\n}"}, {"l": 18, "k": "theory", "q": "Что объявляет запись int* p[3]?", "o": ["Массив из трёх указателей на int", "Указатель на массив из трёх int", "Массив из трёх чисел int", "Указатель на указатель на int"], "e": "Квадратные скобки связываются с именем раньше, чем звёздочка."}, {"l": 18, "k": "theory", "q": "Что объявляет запись int (*p)[3]?", "o": ["Указатель на массив из трёх int", "Массив из трёх указателей на int", "Функцию с тремя параметрами", "Массив из трёх чисел int"], "e": "Скобки вокруг *p делают p указателем."}, {"l": 18, "k": "theory", "q": "Что хранит параметр argc функции main(int argc, char* argv[])?", "o": ["Количество аргументов командной строки", "Первый аргумент командной строки", "Код завершения программы", "Длину имени программы"], "e": "argv - массив строк с самими аргументами."}, {"l": 18, "k": "theory", "q": "Что обычно хранится в argv[0]?", "o": ["Имя (путь) запущенной программы", "Первый параметр пользователя", "Количество параметров", "Пустая строка"], "e": "Параметры пользователя начинаются с argv[1]."}, {"l": 18, "k": "theory", "q": "Почему удобно сортировать массив указателей на строки, а не сами строки?", "o": ["Переставляются только адреса, сами строки не копируются", "Указатели сортируются автоматически", "Строки нельзя сравнивать", "Так расходуется больше памяти"], "e": "Обмен двух указателей дешевле копирования текста."}, {"l": 18, "k": "theory", "q": "Что такое «зубчатый» массив?", "o": ["Массив указателей на строки (массивы) разной длины", "Массив, отсортированный по убыванию", "Массив с отрицательными индексами", "Двумерный массив с одинаковыми строками"], "e": "Для каждой строки хранят указатель и отдельно её длину."}, {"l": 18, "k": "theory", "q": "Какими должны быть функции, адреса которых хранятся в одном массиве указателей на функции?", "o": ["С одинаковой сигнатурой: одинаковые параметры и тип результата", "С одинаковыми именами", "Без параметров и без результата", "Объявленными внутри main"], "e": "Тип элемента массива задаёт сигнатуру функций."}, {"l": 18, "k": "code", "q": "Какой фрагмент компилируется и изменяет b через массив указателей (выводит 24)?", "o": ["int a = 1, b = 2, c = 3;\nint* p[3] = {&a, &b, &c};\n*p[1] = 20;\ncout << a + b + c;", "int a = 1, b = 2, c = 3;\nint* p[3] = {a, b, c};\n*p[1] = 20;\ncout << a + b + c;", "int a = 1, b = 2, c = 3;\nint* p[3] = {&a, &b, &c};\np[1] = 20;\ncout << a + b + c;", "int a = 1, b = 2, c = 3;\nint p[3] = {&a, &b, &c};\n*p[1] = 20;\ncout << a + b + c;"], "e": "Элементы массива указателей - адреса; значение изменяют через разыменование *p[1]."}, {"l": 18, "k": "code", "q": "Какой фрагмент компилируется и правильно выводит все дни из массива C-строк?", "o": ["const char* days[3] = {\"Mon\", \"Tue\", \"Wed\"};\nfor (int i = 0; i < 3; i++) cout << days[i] << \" \";", "const char days[3] = {\"Mon\", \"Tue\", \"Wed\"};\nfor (int i = 0; i < 3; i++) cout << days[i] << \" \";", "const char* days[3] = {'Mon', 'Tue', 'Wed'};\nfor (int i = 0; i < 3; i++) cout << days[i] << \" \";", "const char* days[3] = {\"Mon\", \"Tue\", \"Wed\"};\nfor (int i = 0; i <= 3; i++) cout << days[i] << \" \";"], "e": "Массив строк - это массив указателей const char*; строки пишут в двойных кавычках; индексы от 0 до 2."}, {"l": 18, "k": "code", "q": "Какой фрагмент компилируется и выводит первые буквы слов и длину второго слова (ak4)?", "o": ["const char* w[2] = {\"apple\", \"kiwi\"};\ncout << w[0][0] << w[1][0] << strlen(w[1]);", "const char* w[2] = {\"apple\", \"kiwi\"};\ncout << w[0][0] << w[1, 0] << strlen(w[1]);", "const char* w[2] = {\"apple\", \"kiwi\"};\ncout << w[0][0] << w[1][0] << w[1].size();", "const char* w[2] = {\"apple\", \"kiwi\"};\ncout << *w[0][0] << w[1][0] << strlen(w[1]);"], "e": "Символ строки получают двумя парами скобок: w[i][j]; у C-строк нет методов, длину даёт strlen."}, {"l": 18, "k": "code", "q": "Какой фрагмент компилируется и изменяет первую букву слова (выводит bat)?", "o": ["char a[] = \"cat\";\nchar* words[1] = {a};\nwords[0][0] = 'b';\ncout << words[0];", "const char* words[1] = {\"cat\"};\nwords[0][0] = 'b';\ncout << words[0];", "char a[] = \"cat\";\nchar* words[1] = {a};\nwords[0][0] = \"b\";\ncout << words[0];", "char a[] = \"cat\";\nchar* words[1] = {a};\nwords[0] = 'b';\ncout << words[0];"], "e": "Строковый литерал изменять нельзя (const char*): изменяемый текст хранят в массиве char; символ пишут в одинарных кавычках."}, {"l": 18, "k": "code", "q": "Какая программа компилируется и правильно сортирует массив указателей на строки по алфавиту (выводит apple)?", "o": ["bool lessStr(const char* a, const char* b) {\n    return strcmp(a, b) < 0;\n}\n\nint main() {\n    const char* w[3] = {\"pear\", \"apple\", \"kiwi\"};\n    sort(w, w + 3, lessStr);\n    cout << w[0];\n    return 0;\n}", "bool lessStr(const char* a, const char* b) {\n    return strcmp(a, b) > 0;\n}\n\nint main() {\n    const char* w[3] = {\"pear\", \"apple\", \"kiwi\"};\n    sort(w, w + 3, lessStr);\n    cout << w[0];\n    return 0;\n}", "bool lessStr(const char* a, const char* b) {\n    return strcmp(a, b) < 0;\n}\n\nint main() {\n    const char* w[3] = {\"pear\", \"apple\", \"kiwi\"};\n    sort(w, w + 3);\n    cout << w[0];\n    return 0;\n}", "bool lessStr(const char* a, const char* b) {\n    return strcmp(a, b) < 0;\n}\n\nint main() {\n    const char* w[3] = {\"pear\", \"apple\", \"kiwi\"};\n    sort(w, w + 3, lessStr(w[0], w[1]));\n    cout << w[0];\n    return 0;\n}"], "e": "Без функции сравнения сортируются адреса, а не текст; для порядка по алфавиту правило strcmp(a, b) < 0; в sort передают имя функции."}, {"l": 18, "k": "code", "q": "Какой фрагмент компилируется и меняет две строки местами через указатели (выводит two one)?", "o": ["const char* a = \"one\";\nconst char* b = \"two\";\nconst char* t = a;\na = b;\nb = t;\ncout << a << \" \" << b;", "const char* a = \"one\";\nconst char* b = \"two\";\nchar t = a;\na = b;\nb = t;\ncout << a << \" \" << b;", "const char* a = \"one\";\nconst char* b = \"two\";\nconst char* t = a;\n*a = *b;\n*b = *t;\ncout << a << \" \" << b;", "const char* a = \"one\";\nconst char* b = \"two\";\nconst char* t = a;\nb = t;\na = b;\ncout << a << \" \" << b;"], "e": "Меняются местами адреса, поэтому временная переменная тоже указатель; сами литералы изменять нельзя; порядок обмена важен."}, {"l": 18, "k": "code", "q": "Программа запущена без параметров. Какой вариант компилируется и выводит количество аргументов (1)?", "o": ["int main(int argc, char* argv[]) {\n    for (int i = 1; i < argc; i++) cout << argv[i] << endl;\n    cout << argc;\n    return 0;\n}", "int main(int argc, char* argv[]) {\n    for (int i = 1; i <= argc; i++) cout << argv[i] << endl;\n    cout << argc;\n    return 0;\n}", "int main(int argc; char* argv[]) {\n    for (int i = 1; i < argc; i++) cout << argv[i] << endl;\n    cout << argc;\n    return 0;\n}", "int main(int argc, char* argv[]) {\n    for (int i = 1; i < argc; i++) cout << argv[i].size() << endl;\n    cout << argc;\n    return 0;\n}"], "e": "Допустимые индексы argv - от 0 до argc - 1: элемент argv[argc] равен нулевому указателю; параметры функции разделяют запятой."}, {"l": 18, "k": "code", "q": "Какая программа компилируется и правильно находит лучшего студента через массив указателей на структуры (выводит Vali)?", "o": ["struct Student {\n    string name;\n    int score;\n};\n\nint main() {\n    Student a = {\"Ali\", 80}, b = {\"Vali\", 95};\n    Student* g[2] = {&a, &b};\n    Student* best = g[0];\n    for (int i = 1; i < 2; i++) if (g[i]->score > best->score) best = g[i];\n    cout << best->name;\n    return 0;\n}", "struct Student {\n    string name;\n    int score;\n};\n\nint main() {\n    Student a = {\"Ali\", 80}, b = {\"Vali\", 95};\n    Student* g[2] = {&a, &b};\n    Student* best = g[0];\n    for (int i = 1; i < 2; i++) if (g[i].score > best.score) best = g[i];\n    cout << best->name;\n    return 0;\n}", "struct Student {\n    string name;\n    int score;\n};\n\nint main() {\n    Student a = {\"Ali\", 80}, b = {\"Vali\", 95};\n    Student* g[2] = {a, b};\n    Student* best = g[0];\n    for (int i = 1; i < 2; i++) if (g[i]->score > best->score) best = g[i];\n    cout << best->name;\n    return 0;\n}", "struct Student {\n    string name;\n    int score;\n};\n\nint main() {\n    Student a = {\"Ali\", 80}, b = {\"Vali\", 95};\n    Student* g[2] = {&a, &b};\n    Student* best = g[0];\n    for (int i = 1; i < 2; i++) if (g[i]->score < best->score) best = g[i];\n    cout << best->name;\n    return 0;\n}"], "e": "К полю через указатель обращаются оператором ->; в массиве указателей хранят адреса; для поиска лучшего нужен знак >."}, {"l": 18, "k": "code", "q": "Какой фрагмент компилируется и правильно работает с динамическим массивом указателей (выводит 5)?", "o": ["int** rows = new int*[2];\nrows[0] = new int[2]{1, 2};\nrows[1] = new int[3]{3, 4, 5};\ncout << rows[1][2];\ndelete[] rows[0];\ndelete[] rows[1];\ndelete[] rows;", "int* rows = new int*[2];\nrows[0] = new int[2]{1, 2};\nrows[1] = new int[3]{3, 4, 5};\ncout << rows[1][2];\ndelete[] rows[0];\ndelete[] rows[1];\ndelete[] rows;", "int** rows = new int*[2];\nrows[0] = new int[2]{1, 2};\nrows[1] = new int[3]{3, 4, 5};\ncout << rows[2][1];\ndelete[] rows[0];\ndelete[] rows[1];\ndelete[] rows;", "int const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const KW = new Set('int double float char bool void string long short unsigned const constexpr if else for while do switch case default break continue return goto struct class public private new delete true false nullptr using namespace sizeof static_cast vector unique_ptr size_t'.split(' '));
function hl(src) {   // простая подсветка C++ для блоков кода
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b\d[\w.']*)|([A-Za-z_]\w*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = esc(m[0]);
    out += m[1] ? `<span class="c">${t}</span>` : m[2] ? `<span class="s">${t}</span>` : m[3] ? `<span class="n">${t}</span>` : KW.has(m[0]) ? `<span class="k">${t}</span>` : t;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

}

function start(ids) {
  S = {
    mode: cfg.mode, cur: 0, t0: Date.now(), limit: cfg.mode === 'exam' ? ids.length * SEC_PER_Q : 0, spent: 0,
    items: ids.map(id => ({ id, q: DATA[id], order: shuffle([0, 1, 2, 3]), pick: null }))
  };
  clearInterval(timer);
  timer = setInterval(tick, 1000);
  renderQuiz(); window.scrollTo(0, 0);
}
function tick() {
  if (!S) return;
  S.spent = (Date.now() - S.t0) / 1000;
  const el = document.getElementById('clock');
  if (S.limit) {
    const left = S.limit - S.spent;
    if (el) { el.textContent = 'Осталось ' + fmt(left); el.style.background = left < 60 ? 'var(--bad)' : ''; }
    if (left <= 0) finish();
  } else if (el) el.textContent = 'Время ' + fmt(S.spent);
}
const answered = () => S.items.filter(it => it.pick !== null).length;
const isRight = it => it.pick !== null && it.order[it.pick] === 0;
function optBody(q, i) {
  const t = q.o[i];
  return q.k === 'theory' ? `<span>${esc(t)}</span>` : `<pre>${q.k === 'code' ? hl(t) : esc(t)}</pre>`;
}
function kindName(q) {

}

    return `<button class="opt l${pos} ${c}" data-pick="${pos}" ${locked ? 'disabled' : ''}><span class="let">${LET[pos]}</span><span class="body">${optBody(q, oi)}</span></button>`;
  }).join('')}</div>
  ${locked ? `<div class="verdict ${isRight(it) ? 'ok' : 'no'}"><b class="${isRight(it) ? 'ok' : 'no'}">${isRight(it) ? 'Верно.' : 'Неверно. Правильный ответ: ' + LET[it.order.indexOf(0)] + '.'}</b> ${esc(q.e)}</div>` : ''}
  <div class="row spread">
    <div class="row">
      <button class="btn" id="prev" ${S.cur === 0 ? 'disabled' : ''}>Назад</button>
      <button class="btn ${S.cur < n - 1 ? 'primary' : ''}" id="next" ${S.cur === n - 1 ? 'disabled' : ''}>Дальше</button>
    </div>
    <button class="btn ${S.cur === n - 1 || answered() === n ? 'primary' : ''}" id="fin">Завершить</button>
  </div>
  <p class="small muted">Клавиши: 1-4 выбрать вариант, стрелки влево и вправо листать вопросы.</p>`;
  S.fresh = -1;
  tick();
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
  app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => pick(+b.dataset.pick));
  document.getElementById('prev').onclick = () => go(S.cur - 1);
  document.getElementById('next').onclick = () => go(S.cur + 1);
  document.getElementById('fin').onclick = askFinish;
}
function go(i) { if (i < 0 || i >= S.items.length) return; S.cur = i; renderQuiz(); window.scrollTo(0, 0); }
function pick(pos) {
  const it = S.items[S.cur];
  if (S.mode === 'train' && it.pick !== null) return;
  it.pick = pos;
  if (S.mode === 'train') { S.streak = isRight(it) ? (S.streak || 0) + 1 : 0; S.fresh = S.cur; }
  renderQuiz();
}
function askFinish() {
  const left = S.items.length - answered();
  if (!left) return finish();
  confirmBox('Завершить попытку?', `Без ответа осталось вопросов: <b class="num">${left}</b>. Они будут засчитаны как неверные.`, 'Завершить', finish);
}
document.addEventListener('keydown', e => {
  if (!S || S.done || document.querySelector('.overlay')) return;
  if (e.key >= '1' && e.key <= '4') pick(+e.key - 1);
  else if (e.key === 'ArrowRight') go(S.cur + 1);
  else if (e.key === 'ArrowLeft') go(S.cur - 1);
});

/* ---------- результат ---------- */
function finish() {
  clearInterval(timer);
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  S.spent = Math.min((Date.now() - S.t0) / 1000, S.limit || Infinity);
  S.done = true;
  const n = S.items.length, right = S.items.filter(isRight).length, pct = Math.round(right / n * 100), g = grade(pct);
  const byL = {};
  S.items.forEach(it => { const b = byL[it.q.l] = byL[it.q.l] || [0, 0]; b[1]++; if (isRight(it)) b[0]++; });
  const wrong = S.items.filter(it => !isRight(it));
  const date = new Date().toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });
  const summary = [
    'Тренажёр «Найди ошибку», C++, лекции 1-18',
    'Студент: ' + (cfg.name || 'не указан'),
    'Дата: ' + date,
    'Режим: ' + (S.mode === 'train' ? 'тренировка' : 'экзамен'),
    `Результат: ${right} из ${n} (${pct} %), оценка ${g}`,
    'Время: ' + fmt(S.spent),
    'По лекциям: ' + Object.entries(byL).map(([l, [a, b]]) => `Л${l} ${a}/${b}`).join(', ')
  ].join('\n');
  app.innerHTML = `
  <header><p class="muted small">${esc(cfg.name || 'Студент не указан')}, ${date}, ${S.mode === 'train' ? 'тренировка' : 'экзамен'}</p><h1>Результат попытки</h1></header>
  <div class="score">
    <div class="tile grade"><div class="small">Оценка</div><div class="big">${g}</div></div>
    <div class="tile"><div class="small muted">Верных ответов</div><div class="big">${right} <span class="muted" style="font-size:18px;font-weight:500">из ${n}</span></div></div>
    <div class="tile"><div class="small muted">Процент</div><div class="big">${pct} %</div></div>
    <div class="tile"><div class="small muted">Время</div><div class="big">${fmt(S.spent)}</div></div>
  </div>
  <p class="small muted">Шкала: 90 % и выше - 5, от 75 % - 4, от 60 % - 3, от 40 % - 2, ниже - 1.</p>
  <section class="card"><h2>По лекциям</h2>
    ${Object.entries(byL).map(([l, [a, b]]) => `<div class="lrow"><span><b>${l}.</b> ${esc(LECT[l])}</span>
      <span class="bar"><i class="${a / b >= .75 ? 'high' : a / b < .6 ? 'low' : ''}" style="width:${a / b * 100}%"></i></span><span class="num small">${a} из ${b}</span></div>`).join('')}
  </section>
  <div class="row">
    <button class="btn primary" id="again">Новая попытка</button>
    ${wrong.length ? `<button class="btn" id="redo">Повторить ошибки (${wrong.length})</button>` : ''}
    <button class="btn" id="copy">Скопировать результат</button>
    <span class="small muted" id="copied"></span>
  </div>
  <div id="copybox"></div>
  ${S.mode === 'exam' ? '<p class="note" id="savestate">Сохраняем результат для преподавателя...</p>' : ''}
  <section class="card"><h2>${wrong.length ? 'Разбор ошибок: ' + wrong.length : 'Ошибок нет'}</h2>
    ${wrong.length ? reviewHTML(wrong.map(it => ({ num: S.items.indexOf(it) + 1, q: it.q, po: it.pick === null ? -1 : it.order[it.pick] }))) : '<p>Все ответы верные.</p>'}
  </section>`;
  if (S.mode === 'exam') saveResult({
    t: Date.now(), name: cfg.name || '', n, right, pct, grade: g, spent: Math.round(S.spent), byL,
    ans: S.items.map(it => [it.id, it.pick === null ? -1 : it.order[it.pick]])
  });
  window.scrollTo(0, 0);
  document.getElementById('again').onclick = renderSetup;
  const redo = document.getElementById('redo');
  if (redo) redo.onclick = () => { cfg.mode = 'train'; start(shuffle(wrong.map(it => it.id))); };
  document.getElementById('copy').onclick = () => copyText(summary, document.getElementById('copied'),
    document.getElementById('copybox'), 'Скопировано. Вставьте текст в сообщение преподавателю.');
}
async function saveResult(payload) {
  const el = () => document.getElementById('savestate');
  const fail = why => { const e = el(); if (e) { e.className = 'note no'; e.textContent = 'Результат не сохранён: ' + why + ' Нажмите «Скопировать результат» и отправьте текст преподавателю.'; } };
  if (!db || !uid) return fail('страница открыта без входа в аккаунт с доступом к общим данным.');
  try {
    await db.doc('results/' + uid).set({ t: payload.t });
    await db.collection('results/' + uid + '/a').add(payload);
    const e = el(); if (e) { e.className = 'note ok'; e.textContent = 'Результат сохранён и виден преподавателю.'; }
  } catch (err) {
    fail(err && err.code === 'invalid_argument' ? 'у вашего аккаунта нет права записи (нужен доступ «Участник»).' : 'хранилище сейчас недоступно.');
  }
}

/* ---------- панель преподавателя ---------- */
let A = { rows: [], names: {}, open: null, state: 'load' };
async function loadAdmin() {
  A.state = 'load'; drawAdmin();
  const guard = setTimeout(() => { if (A.state === 'load') { A.state = 'slow'; drawAdmin(); } }, 10000);
  try {
    const users = await db.collection('results').get();
    const rows = [];
    for (const u of users.docs) {
      const as = await db.collection('results/' + u.id + '/a').get();
      as.docs.forEach(d => rows.push(Object.assign({ uid: u.id, id: d.id }, d.data())));
    }
    rows.sort((x, y) => (y.t || 0) - (x.t || 0));
    A.rows = rows; A.users = users.docs.map(d => d.id); A.state = 'ok';
    try { A.names = (await user.profiles([...new Set(rows.map(r => r.uid))])) || {}; } catch (e) { A.names = {}; }
  } catch (e) { A.state = 'err'; }
  clearTimeout(guard); drawAdmin();
}
function renderAdmin() { clearInterval(timer); S = null; A.open = null; loadAdmin(); }
function drawAdmin() {
  const r = A.rows, avg = r.length ? Math.round(r.reduce((s, x) => s + (x.pct || 0), 0) / r.length) : 0;
  const who = x => esc(x.name || 'без имени');
  const acc = x => { const p = A.names[x.uid]; return p && p.name ? esc(p.name) : ''; };
  const date = x => new Date(x.t).toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });
  const state = A.state === 'load' ? 'Загружаем результаты...' : A.state === 'slow' ? 'Хранилище пока не отвечает. Подождите или нажмите «Обновить».'
    : A.state === 'err' ? 'Не удалось прочитать результаты. Нажмите «Обновить».' : '';
  let detail = '';
  const o = r.find(x => x.id === A.open);
  if (o) {
    const wrong = (o.ans || []).map((a, i) => ({ num: i + 1, q: DATA[a[0]], po: a[1] })).filter(x => x.q && x.po !== 0);
    detail = `<section class="card"><div class="row spread"><h2>${who(o)}: ${o.right} из ${o.n}, оценка ${o.grade}</h2><button class="btn mini" id="closed">Закрыть</button></div>
      <p class="small muted">${date(o)}, время ${fmt(o.spent || 0)}${acc(o) ? ', аккаунт: ' + acc(o) : ''}</p>
      ${Object.entries(o.byL || {}).map(([l, [a, b]]) => `<div class="lrow"><span><b>${l}.</b> ${esc(LECT[l] || '')}</span>
        <span class="bar"><i class="${a / b >= .75 ? 'high' : a / b < .6 ? 'low' : ''}" style="width:${a / b * 100}%"></i></span><span class="num small">${a} из ${b}</span></div>`).join('')}
      <h2>${wrong.length ? 'Ошибки: ' + wrong.length : 'Ошибок нет'}</h2>${reviewHTML(wrong)}</section>`;
  }
  app.innerHTML = `
  <header><p class="muted small">Видят только владелец и редакторы страницы</p><h1>Результаты экзамена</h1></header>
  <div class="score">
    <div class="tile"><div class="small muted">Попыток</div><div class="big">${r.length}</div></div>
    <div class="tile"><div class="small muted">Студентов</div><div class="big">${new Set(r.map(x => (x.name || x.uid).toLowerCase())).size}</div></div>
    <div class="tile"><div class="small muted">Средний процент</div><div class="big">${avg} %</div></div>
  </div>
  <div class="row">
    <button class="btn" id="back">К тренажёру</button>
    <button class="btn" id="reload">Обновить</button>
    <button class="btn" id="tsv" ${r.length ? '' : 'disabled'}>Скопировать таблицу</button>
    <button class="btn danger" id="reset" ${r.length ? '' : 'disabled'}>Сбросить все результаты</button>
    <span class="small muted" id="amsg">${state}</span>
  </div>
  <div id="abox"></div>
  ${r.length ? `<div class="tablewrap"><table>
    <thead><tr><th>Студент</th><th>Дата</th><th>Вопросов</th><th>Верно</th><th>%</th><th>Оценка</th><th>Время</th><th></th></tr></thead>
    <tbody>${r.map(x => `<tr>
      <td>${who(x)}${acc(x) ? `<br><span class="small muted">${acc(x)}</span>` : ''}</td><td>${date(x)}</td>
      <td class="n">${x.n}</td><td class="n">${x.right}</td><td class="n">${x.pct}</td>
      <td><span class="pill g${x.grade}">${x.grade}</span></td><td class="n">${fmt(x.spent || 0)}</td>
      <td><button class="btn mini" data-open="${x.id}">Подробнее</button> <button class="btn mini danger" data-del="${x.id}">Удалить</button></td></tr>`).join('')}
    </tbody></table></div>` : (A.state === 'ok' ? '<p class="note">Сохранённых результатов пока нет. Они появятся здесь, когда студенты завершат экзамен.</p>' : '')}
  ${detail}`;
  document.getElementById('back').onclick = renderSetup;
  document.getElementById('reload').onclick = loadAdmin;
  const cd = document.getElementById('closed'); if (cd) cd.onclick = () => { A.open = null; drawAdmin(); };
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { A.open = b.dataset.open; drawAdmin(); const c = document.getElementById('closed'); if (c) c.scrollIntoView({ block: 'start' }); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const x = r.find(y => y.id === b.dataset.del);
    confirmBox('Удалить результат?', `${who(x)}, ${date(x)}: ${x.right} из ${x.n}. Восстановить его будет нельзя.`, 'Удалить', () => removeRows([x]));
  });
  document.getElementById('reset').onclick = () => confirmBox('Сбросить все результаты?',
    `Будут удалены все сохранённые попытки: <b class="num">${r.length}</b>. Восстановить их будет нельзя.`, 'Сбросить все', () => removeRows(r.slice()));
  document.getElementById('tsv').onclick = () => {
    const text = ['Студент\tДата\tВопросов\tВерно\tПроцент\tОценка\tВремя'].concat(r.map(x =>
      [x.name || 'без имени', date(x), x.n, x.right, x.pct, x.grade, fmt(x.spent || 0)].join('\t'))).join('\n');
    copyText(text, document.getElementById('amsg'), document.getElementById('abox'), 'Таблица скопирована. Её можно вставить в Excel.');
  };
}
async function removeRows(list) {
  const msg = () => document.getElementById('amsg');
  let done = 0, failed = 0;
  for (const x of list) {
    try { await db.doc('results/' + x.uid + '/a/' + x.id).delete(); done++; }
    catch (e) {
      await new Promise(res => setTimeout(res, 1200));
      try { await db.doc('results/' + x.uid + '/a/' + x.id).delete(); done++; } catch (e2) { failed++; }
    }
    if (msg()) msg().textContent = `Удалено ${done} из ${list.length}...`;
  }
  const gone = new Set(list.map(x => x.id));
  A.rows = A.rows.filter(x => !gone.has(x.id));
  for (const u of new Set(list.map(x => x.uid))) {
    if (!A.rows.some(x => x.uid === u)) { try { await db.doc('results/' + u).delete(); } catch (e) {} }
  }
  if (gone.has(A.open)) A.open = null;
  drawAdmin();
  if (msg()) msg().textContent = failed ? `Удалено ${done}, не удалось удалить ${failed}. Нажмите «Обновить» и повторите.` : `Удалено результатов: ${done}.`;
}
function boot(d) {
  if (d && d.cfg) cfg = d.cfg;
  if (d && d.S && d.S.items && d.S.items.length) {
    S = Object.assign({}, d.S, { items: d.S.items.filter(x => DATA[x.id]).map(x => ({ id: x.id, q: DATA[x.id], order: x.order, pick: x.pick })) });
    S.cur = Math.min(S.cur, S.items.length - 1);
    clearInterval(timer); timer = setInterval(tick, 1000); renderQuiz();
  } else renderSetup();
}
try {
  window.claude?.hot?.snapshot(() => ({ cfg, S: S && !S.done ? { mode: S.mode, cur: S.cur, t0: S.t0, limit: S.limit, streak: S.streak || 0,
    items: S.items.map(i => ({ id: i.id, order: i.order, pick: i.pick })) } : null }));
} catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
</script>
</body>
