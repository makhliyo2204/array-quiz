<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Командный квиз: одномерные массивы в C++</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1b1f24; --muted:#5d6672; --line:#dfe3e8;
  --accent:#1f5fbf; --ok:#1d8a4a; --okbg:#e5f5ec; --bad:#b3261e; --badbg:#fbeaea;
  --t1:#1f5fbf; --t2:#c25e00; --t3:#1d8a4a; --t4:#8a2be2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"PT Sans",Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh}
button{font-family:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;font-weight:700}
header .round{font-size:16px;color:var(--muted)}
main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:24px 28px;max-width:1280px;width:100%;margin:0 auto}
main>*{flex-shrink:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 22px;border-radius:10px;font-size:18px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default}
.small{font-size:14px;padding:8px 14px}

/* start */
.start{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.panel h2{margin:0 0 14px;font-size:24px}
.panel p{color:var(--muted);font-size:17px;line-height:1.45;margin:0 0 12px}
.roundpick{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.roundpick button{text-align:left;padding:18px 20px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.roundpick button:hover{border-color:var(--accent)}
.roundpick b{display:block;font-size:22px;margin-bottom:4px}
.roundpick span{color:var(--muted);font-size:16px}
.teams-edit label{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:17px}
.teams-edit input{flex:1;font:inherit;font-size:18px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}

/* question */
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.qnum{font-size:18px;color:var(--muted);font-weight:700}
.timer{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
.timer.low{color:var(--bad)}
.qtext{font-size:34px;line-height:1.25;font-weight:700;margin:0 0 16px}
pre.code{font-family:"JetBrains Mono",Consolas,monospace;font-size:24px;line-height:1.45;background:#eef1f5;border:1px solid var(--line);border-radius:12px;padding:16px 22px;margin:0 0 18px;overflow-x:auto;white-space:pre}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.opt{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 20px;font-size:26px;min-height:78px}
.opt .let{flex:none;width:48px;height:48px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px}
.opt code{font-family:"JetBrains Mono",Consolas,monospace;font-size:23px}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .let{background:var(--ok)}
.opt.dim{opacity:.45}
.explain{display:none;background:var(--okbg);border-left:5px solid var(--ok);border-radius:8px;padding:14px 18px;font-size:21px;line-height:1.4;margin-bottom:16px}
.explain.show{display:block}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:8px}
.award{display:none;align-items:center;gap:10px;flex-wrap:wrap}
.award.show{display:flex}
.award .lbl{font-size:17px;color:var(--muted);margin-right:4px}
.tbtn{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.tbtn.on{color:#fff}
.spacer{flex:1}

/* scoreboard */
.board{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 28px;background:var(--card);border-top:1px solid var(--line)}
.team{display:flex;align-items:center;justify-content:space-between;border-radius:10px;padding:10px 16px;border:1px solid var(--line)}
.team .nm{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.team .sc{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}

/* results */
.results h2{font-size:38px;margin:0 0 6px;text-align:center}
.results .sub{text-align:center;color:var(--muted);font-size:19px;margin-bottom:24px}
.bars{display:flex;flex-direction:column;gap:14px;max-width:900px;margin:0 auto 24px;width:100%}
.bar{display:grid;grid-template-columns:44px 230px 1fr 60px;align-items:center;gap:14px;font-size:22px}
.bar .place{font-weight:700;font-size:26px;text-align:center}
.bar .track{height:34px;background:#eef1f5;border-radius:8px;overflow:hidden}
.bar .fill{height:100%;border-radius:8px;transition:width 1s ease}
.bar .v{font-weight:700;text-align:right}
.winner{text-align:center;font-size:28px;font-weight:700;margin-bottom:18px}
.center{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted)}
@media (max-width:900px){
  .start{grid-template-columns:1fr}.opts{grid-template-columns:1fr}
  .qtext{font-size:26px}pre.code{font-size:18px}.opt{font-size:20px}
  .board{grid-template-columns:repeat(2,1fr)}.bar{grid-template-columns:34px 130px 1fr 44px;font-size:18px}
}
</style>
</head>
<body>
<header>
  <h1>Одномерные массивы в C++ · командный квиз</h1>
  <div class="round" id="roundLabel">Открытое занятие</div>
</header>
<main id="app"></main>
<div class="board" id="board"></div>

<script>
const ROUNDS = {
  rep: {
    title: "Раунд 1. Повторение",
    desc: "10 простых вопросов по лекции",
    time: 20,
    qs: [
      {q:"Что такое массив?", opts:["Набор элементов одного типа под общим именем","Одна переменная любого типа","Специальный вид цикла","Функция для ввода данных"], a:0,
       ex:"Массив - это набор однотипных элементов, у которых одно имя, а различаются они номером (индексом)."},
      {q:"Места в кинотеатре нумеруются с 1. А с какого номера нумеруются элементы массива в C++?", opts:["С 1","С 0","С 10","С любого числа"], a:1,
       ex:"Индексы в C++ всегда начинаются с нуля: первый элемент - <code>a[0]</code>."},
      {q:"Сколько оценок поместится в массив?", code:"int marks[25];", opts:["24","25","26","Сколько угодно"], a:1,
       ex:"Число в квадратных скобках при объявлении - это размер массива: 25 элементов."},
      {q:"Какой индекс у последней оценки в этом массиве?", code:"int marks[25];", opts:["25","26","24","0"], a:2,
       ex:"Индексы идут от 0 до 24. Последний индекс всегда на 1 меньше размера."},
      {q:"Как обратиться к третьему элементу массива <code>a</code>?", opts:["<code>a[3]</code>","<code>a(3)</code>","<code>a[2]</code>","<code>a.3</code>"], a:2,
       ex:"Счёт с нуля: первый - a[0], второй - a[1], третий - <b>a[2]</b>."},
      {q:"Чему равен <code>a[0]</code>?", code:"int a[3] = {7, 8, 9};", opts:["7","8","9","0"], a:0,
       ex:"Значения из фигурных скобок записываются по порядку, начиная с a[0]."},
      {q:"Можно ли в одном массиве хранить и числа, и слова?", opts:["Да, всегда","Нет, все элементы массива одного типа","Да, если массив большой","Только в цикле while"], a:1,
       ex:"Тип указывается один раз для всего массива, например <code>int</code>, и все элементы имеют этот тип."},
      {q:"Нужно хранить температуру воздуха за 7 дней (например, 12.5). Какое объявление подходит лучше всего?", opts:["<code>int t[7];</code>","<code>double t[7];</code>","<code>double t;</code>","<code>char t[7];</code>"], a:1,
       ex:"Температура бывает дробной, значит, нужен тип double, а дней 7 - размер 7."},
      {q:"Чем заполнится массив?", code:"int a[5] = {};", opts:["Случайными числами","Нулями","Единицами","Будет ошибка"], a:1,
       ex:"Пустые фигурные скобки заполняют все элементы нулями."},
      {q:"Какой цикл чаще всего используют, чтобы пройти по всем элементам массива?", opts:["<code>for</code>","<code>goto</code>","<code>switch</code>","Цикл не нужен"], a:0,
       ex:"Число элементов известно заранее, поэтому удобен цикл for: <code>for (int i = 0; i &lt; N; i++)</code>."}
    ]
  },
  fix: {
    title: "Раунд 2. Закрепление",
    desc: "20 вопросов по коду: что выведет программа и где ошибка",
    time: 30,
    qs: [
      {q:"Что выведет программа?", code:"int a[3] = {5, 10, 15};\ncout << a[1];", opts:["5","10","15","1"], a:1,
       ex:"a[1] - второй элемент, то есть 10."},
      {q:"Что выведет программа?", code:"int a[3] = {5, 10, 15};\ncout << a[0] + a[2];", opts:["15","25","20","30"], a:2,
       ex:"a[0] = 5, a[2] = 15, сумма 20."},
      {q:"Что выведет программа?", code:"int a[4] = {1, 2, 3, 4};\na[1] = 9;\ncout << a[1];", opts:["2","9","1","11"], a:1,
       ex:"Присваивание заменяет старое значение элемента: теперь a[1] = 9."},
      {q:"Что появится на экране?", code:"int a[3] = {1, 2, 3};\nfor (int i = 0; i < 3; i++)\n    cout << a[i];", opts:["123","321","6","012"], a:0,
       ex:"Цикл по очереди выводит a[0], a[1], a[2]: 123."},
      {q:"В магазине 3 покупки. Сколько всего потрачено?", code:"int price[3] = {2, 4, 6};\nint s = 0;\nfor (int i = 0; i < 3; i++)\n    s += price[i];\ncout << s;", opts:["6","10","12","246"], a:2,
       ex:"Цикл накапливает сумму: 2 + 4 + 6 = 12."},
      {q:"Выведем плейлист с конца. Что появится на экране?", code:"int song[3] = {1, 2, 3};\nfor (int i = 2; i >= 0; i--)\n    cout << song[i];", opts:["123","321","21","32"], a:1,
       ex:"i идёт от 2 до 0: выводятся song[2], song[1], song[0] - 321."},
      {q:"Найдите ошибку:", code:"int a[3];\na[3] = 10;", opts:["Ошибок нет","Нельзя присвоить 10","Элемента a[3] нет - выход за границы","Нужно писать a(3)"], a:2,
       ex:"В массиве из 3 элементов есть только a[0], a[1], a[2]."},
      {q:"Какая самая высокая оценка?", code:"int m[4] = {3, 8, 1, 5};\nint mx = m[0];\nfor (int i = 1; i < 4; i++)\n    if (m[i] > mx) mx = m[i];\ncout << mx;", opts:["3","5","8","4"], a:2,
       ex:"Это поиск максимума: mx запоминает самое большое значение - 8."},
      {q:"Сколько в журнале пятёрок?", code:"int mark[5] = {5, 4, 5, 3, 5};\nint k = 0;\nfor (int i = 0; i < 5; i++)\n    if (mark[i] == 5) k++;\ncout << k;", opts:["2","3","5","4"], a:1,
       ex:"k увеличивается на каждой пятёрке: их три."},
      {q:"Найдите ошибку в цикле:", code:"int a[5];\nfor (int i = 0; i <= 5; i++)\n    a[i] = 0;", opts:["Ошибок нет","Нужно i = 1","Нужно i < 5: при i = 5 выход за границы","Нельзя присваивать 0"], a:2,
       ex:"Условие &lt;= пропускает i = 5, а элемента a[5] нет. Правильно: <code>i &lt; 5</code>."},
      {q:"Что выведет программа?", code:"int a[5] = {1, 2, 3, 4, 5};\nfor (int i = 0; i < 5; i += 2)\n    cout << a[i];", opts:["12345","135","24","531"], a:1,
       ex:"Шаг 2: i = 0, 2, 4 - выводятся 1, 3, 5."},
      {q:"Что делает этот цикл с массивом?", code:"for (int i = 0; i < N; i++)\n    a[i] = a[i] * 2;", opts:["Удваивает каждый элемент","Удваивает размер массива","Выводит массив","Ничего не меняет"], a:0,
       ex:"Каждый элемент заменяется своим удвоенным значением; размер массива не меняется."},
      {q:"Найдите самую холодную ночь недели:", code:"int t[4] = {-3, 2, -7, 0};\nint mn = t[0];\nfor (int i = 1; i < 4; i++)\n    if (t[i] < mn) mn = t[i];\ncout << mn;", opts:["-3","0","-7","2"], a:2,
       ex:"Поиск минимума: самое маленькое число -7."},
      {q:"Сколько чётных чисел в массиве?", code:"int a[4] = {3, 6, 7, 8};\nint k = 0;\nfor (int i = 0; i < 4; i++)\n    if (a[i] % 2 == 0) k++;\ncout << k;", opts:["1","2","3","4"], a:1,
       ex:"Чётные - те, что делятся на 2 без остатка: 6 и 8."},
      {q:"Что выведет программа?", code:"int a[2] = {4, 9};\nint t = a[0];\na[0] = a[1];\na[1] = t;\ncout << a[0] << a[1];", opts:["49","94","44","99"], a:1,
       ex:"Через переменную t элементы поменялись местами: 9 и 4."},
      {q:"Средний балл студента. Что выведет программа?", code:"int m[4] = {5, 4, 3, 4};\nint s = 0;\nfor (int i = 0; i < 4; i++)\n    s += m[i];\ncout << s / 4;", opts:["4","16","3","4.5"], a:0,
       ex:"Сумма 16, 16 / 4 = 4. Для дробного ответа нужно делить на 4.0."},
      {q:"Какое объявление массива правильное?", opts:["<code>int a[];</code>","<code>const int N = 10; int a[N];</code>","<code>int a[0.5];</code>","<code>int a[-3];</code>"], a:1,
       ex:"Размер - целая положительная константа. Без размера можно только со списком значений: <code>int a[] = {1, 2};</code>"},
      {q:"Что выведет программа?", code:"int a[5] = {0};\na[2] = a[2] + 1;\ncout << a[2] + a[3];", opts:["0","1","2","3"], a:1,
       ex:"Все элементы равны 0, a[2] стал 1, a[3] остался 0: 1 + 0 = 1."},
      {q:"На каком месте впервые встречается 7?", code:"int a[4] = {4, 7, 2, 7};\nfor (int i = 0; i < 4; i++)\n    if (a[i] == 7) {\n        cout << i;\n        break;\n    }", opts:["1","3","13","2"], a:0,
       ex:"Первая семёрка на индексе 1, после неё break останавливает цикл."},
      {q:"Сколько раз выполнится тело цикла?", code:"int a[10];\nfor (int i = 0; i < 10; i++)\n    cin >> a[i];", opts:["9","10","11","Бесконечно"], a:1,
       ex:"i принимает значения от 0 до 9 - ровно 10 раз, по одному на каждый элемент."}
    ]
  }
};
const COLORS = ["var(--t1)","var(--t2)","var(--t3)","var(--t4)"];
const state = {
  teams:["Индексы","Байты","Циклы","Элементы"],
  scores:[0,0,0,0],
  round:null, qi:0, revealed:false, correct:[false,false,false,false], timer:null, left:0
};
const app = document.getElementById("app");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function renderBoard(bumpIdx){
  const b = document.getElementById("board");
  b.innerHTML = state.teams.map((t,i)=>`
    <div class="team" style="border-color:${COLORS[i]}">
      <div class="nm"><span class="dot" style="background:${COLORS[i]}"></span>${esc(t)}</div>
      <div class="sc ${bumpIdx&&bumpIdx.includes(i)?'bump':''}" style="color:${COLORS[i]}">${state.scores[i]}</div>
    </div>`).join("");
}

function renderStart(){
  stopTimer();
  document.getElementById("roundLabel").textContent = "Открытое занятие";
  app.innerHTML = `
  <div class="start">
    <div class="panel">
      <h2>Выберите раунд</h2>
      <p>На каждый вопрос команда совещается и поднимает карточку с буквой ответа (A, B, C или D). После ответа преподаватель открывает правильный вариант и отмечает команды, которые ответили верно. Баллы двух раундов суммируются.</p>
      <div class="roundpick">
        <button data-r="rep"><b>${ROUNDS.rep.title}</b><span>${ROUNDS.rep.desc} · ${ROUNDS.rep.time} с на вопрос</span></button>
        <button data-r="fix"><b>${ROUNDS.fix.title}</b><span>${ROUNDS.fix.desc} · ${ROUNDS.fix.time} с на вопрос</span></button>
      </div>
    </div>
    <div class="panel teams-edit">
      <h2>Команды</h2>
      ${state.teams.map((t,i)=>`<label><span class="dot" style="background:${COLORS[i]}"></span><input data-t="${i}" value="${esc(t)}" maxlength="22"></label>`).join("")}
      <div style="display:flex;gap:10px;align-items:center;margin-top:14px">
        <button class="btn small" id="reset">Обнулить баллы</button>
        <span class="hint">Клавиши: пробел - таймер, Enter - ответ / далее</span>
      </div>
    </div>
  </div>`;
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>startRound(b.dataset.r));
  app.querySelectorAll("[data-t]").forEach(inp=>inp.oninput=()=>{state.teams[+inp.dataset.t]=inp.value||("Команда "+(+inp.dataset.t+1));renderBoard();});
  document.getElementById("reset").onclick=()=>{state.scores=[0,0,0,0];renderBoard();};
  renderBoard();
}

function startRound(r){ state.round=r; state.qi=0; renderQ(); }

function renderQ(){
  stopTimer();
  const R = ROUNDS[state.round], Q = R.qs[state.qi];
  state.revealed=false; state.correct=[false,false,false,false]; state.left=R.time;
  document.getElementById("roundLabel").textContent = R.title;
  app.innerHTML = `
    <div class="qtop">
      <div class="qnum">Вопрос ${state.qi+1} из ${R.qs.length}</div>
      <div class="timer" id="timer">${R.time} с</div>
    </div>
    <p class="qtext">${Q.q}</p>
    ${Q.code?`<pre class="code">${esc(Q.code)}</pre>`:""}
    <div class="opts">${Q.opts.map((o,i)=>`<div class="opt" data-o="${i}"><span class="let">${"ABCD"[i]}</span><span>${o}</span></div>`).join("")}</div>
    <div class="explain" id="explain">${Q.ex}</div>
    <div class="controls">
      <button class="btn" id="tbtn">▶ Таймер</button>
      <button class="btn primary" id="reveal">Показать ответ</button>
      <div class="award" id="award"><span class="lbl">Верно ответили:</span>
        ${state.teams.map((t,i)=>`<button class="tbtn" data-a="${i}" style="border-color:${COLORS[i]}"><span class="dot" style="background:${COLORS[i]}"></span>${esc(t)}</button>`).join("")}
      </div>
      <span class="spacer"></span>
      <button class="btn small" id="menu">В меню</button>
      <button class="btn primary" id="next" style="display:none">${state.qi+1<R.qs.length?"Далее →":"Итоги раунда"}</button>
    </div>`;
  document.getElementById("tbtn").onclick=toggleTimer;
  document.getElementById("reveal").onclick=reveal;
  document.getElementById("menu").onclick=renderStart;
  document.getElementById("next").onclick=next;
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.a; state.correct[i]=!state.correct[i];
    b.classList.toggle("on",state.correct[i]); b.style.background=state.correct[i]?COLORS[i]:"";
    b.querySelector(".dot").style.background=state.correct[i]?"#fff":COLORS[i];
  });
}

function toggleTimer(){
  if(state.revealed) return;
  if(state.timer){ stopTimer(); return; }
  document.getElementById("tbtn").textContent="⏸ Пауза";
  state.timer=setInterval(()=>{
    state.left--; const el=document.getElementById("timer");
    if(el){ el.textContent=state.left+" с"; el.classList.toggle("low",state.left<=5); }
    if(state.left<=0){ stopTimer(); if(el) el.textContent="Время!"; }
  },1000);
}
function stopTimer(){ if(state.timer){clearInterval(state.timer);state.timer=null;} const t=document.getElementById("tbtn"); if(t) t.textContent="▶ Таймер"; }

function reveal(){
  if(state.revealed) return;
  stopTimer(); state.revealed=true;
  const Q = ROUNDS[state.round].qs[state.qi];
  app.querySelectorAll(".opt").forEach(o=>o.classList.add(+o.dataset.o===Q.a?"right":"dim"));
  document.getElementById("explain").classList.add("show");
  document.getElementById("award").classList.add("show");
  document.getElementById("reveal").style.display="none";
  document.getElementById("tbtn").disabled=true;
  document.getElementById("next").style.display="";
}

function next(){
  const got=[]; state.correct.forEach((c,i)=>{if(c){state.scores[i]++;got.push(i);}});
  renderBoard(got);
  const R=ROUNDS[state.round];
  if(state.qi+1<R.qs.length){ state.qi++; renderQ(); } else renderResults();
}

function renderResults(){
  stopTimer();
  const R=ROUNDS[state.round];
  const order=state.teams.map((t,i)=>i).sort((x,y)=>state.scores[y]-state.scores[x]);
  const max=Math.max(1,...state.scores);
  const top=state.scores[order[0]];
  const leaders=order.filter(i=>state.scores[i]===top).map(i=>state.teams[i]);
  const other = state.round==="rep"?"fix":"rep";
  app.innerHTML = `
  <div class="results">
    <h2>Итоги: ${R.title.replace(/^Раунд \d\. /,"")}</h2>
    <div class="sub">Баллы суммируются по всем сыгранным раундам</div>
    <div class="winner">${top===0?"Пока никто не набрал баллов":(leaders.length>1?"Лидируют: ":"Лидирует команда ")+leaders.map(esc).join(", ")}</div>
    <div class="bars">${order.map((i,k)=>`
      <div class="bar"><div class="place">${k+1}</div><div>${esc(state.teams[i])}</div>
      <div class="track"><div class="fill" data-w="${state.scores[i]/max*100}" style="width:0;background:${COLORS[i]}"></div></div>
      <div class="v">${state.scores[i]}</div></div>`).join("")}</div>
    <div class="center">
      <button class="btn primary" id="go">${ROUNDS[other].title} →</button>
      <button class="btn" id="menu">В меню</button>
    </div>
  </div>`;
  requestAnimationFrame(()=>setTimeout(()=>app.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%"),50));
  document.getElementById("go").onclick=()=>startRound(other);
  document.getElementById("menu").onclick=renderStart;
}

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||!state.round||!document.getElementById("reveal")) return;
  if(e.code==="Space"){ e.preventDefault(); toggleTimer(); }
  if(e.key==="Enter"){ e.preventDefault(); state.revealed?next():reveal(); }
});
renderStart();
</script>
</body>
</html>
