<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр «Найди ошибку» C++</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Bug hunt: bright paper, thick ink outlines with hard offset shadows, one colour per answer letter,
   code shown as a dark editor pane. Boldness lives in the yellow hero and the answer cards. */
:root {
  --bg: #eef2ff;
  --surface: #ffffff;
  --ink: #14132e;
  --muted: #565a7d;
  --edge: #14132e;
  --shadow: #14132e;
  --accent: #ffd60a;
  --on-accent: #14132e;
  --accent-soft: #fff3b0;
  --a: #ff5c8a; --b: #3da5ff; --c: #ff9f1c; --d: #9b6bff;
  --good: #0e9f5b; --good-soft: #cff7df;
  --bad: #e5352b; --bad-soft: #ffdcd8;
  --code-bg: #171a2e; --code-ink: #e9ecff;
  --font-display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --font-body: "Onest", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e0f22; --surface: #1b1d3a; --ink: #f3f4ff; --muted: #a6abd4; --edge: #6d73c4; --shadow: #000000;
    --accent-soft: #3a3410; --good: #3ddc8f; --good-soft: #103a27; --bad: #ff7a70; --bad-soft: #43181a;
    --code-bg: #0a0b18;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0f22; --surface: #1b1d3a; --ink: #f3f4ff; --muted: #a6abd4; --edge: #6d73c4; --shadow: #000000;
  --accent-soft: #3a3410; --good: #3ddc8f; --good-soft: #103a27; --bad: #ff7a70; --bad-soft: #43181a;
  --code-bg: #0a0b18;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  background-image: radial-gradient(color-mix(in srgb, var(--edge) 16%, transparent) 1.2px, transparent 1.2px); background-size: 22px 22px; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 72px; display: flex; flex-direction: column; gap: 22px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 6vw, 46px); line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 2.5px solid var(--edge); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 6px 6px 0 var(--shadow); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { justify-content: space-between; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--b); outline-offset: 2px; }

/* hero */
.hero { background: var(--accent); color: var(--on-accent); border: 2.5px solid var(--edge); border-radius: 20px; padding: 26px 24px; box-shadow: 8px 8px 0 var(--shadow);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; position: relative; overflow: hidden; }
.hero .eyebrow { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.hero svg { width: 132px; height: 132px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { background: #14132e; color: #fff; font-family: var(--font-mono); font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }
@media (max-width: 520px) { .hero { grid-template-columns: 1fr; } .hero svg { width: 88px; height: 88px; position: absolute; right: 10px; bottom: 6px; opacity: .9; } .chips { padding-right: 90px; } }

/* buttons */
.btn { border: 2.5px solid var(--edge); background: var(--surface); border-radius: 12px; padding: 9px 18px; font-weight: 600; box-shadow: 3px 3px 0 var(--shadow); transition: transform .08s, box-shadow .08s; }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--shadow); }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
.btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.big { font-family: var(--font-display); font-size: 18px; padding: 13px 26px; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.mini { padding: 4px 10px; font-size: 13px; box-shadow: 2px 2px 0 var(--shadow); border-width: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
input[type=text] { font: inherit; color: var(--ink); background: var(--surface); border: 2.5px solid var(--edge); border-radius: 12px; padding: 10px 14px; width: 100%; max-width: 380px; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
legend { font-family: var(--font-display); font-size: 15px; padding: 0; margin-bottom: 10px; }
.lects { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 6px 14px; }
@media (max-width: 420px) { .lects { grid-template-columns: 1fr; } }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; }
.check:has(input:checked) { background: var(--accent-soft); border-color: var(--edge); }
.check input { margin-top: 5px; accent-color: var(--ink); width: 16px; height: 16px; flex: none; }
.check b { font-family: var(--font-mono); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { border: 2.5px solid var(--edge); border-radius: 999px; padding: 6px 16px; cursor: pointer; background: var(--surface); font-weight: 600; }
.seg input, .modes input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.modes label { border: 2.5px solid var(--edge); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.modes b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.modes label:has(input:checked) { box-shadow: 5px 5px 0 var(--shadow); transform: translate(-2px, -2px); }
.modes label.m-train:has(input:checked) { background: var(--good-soft); }
.modes label.m-exam:has(input:checked) { background: var(--bad-soft); }

/* quiz */
.status { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 2.5px solid var(--edge); }
.clock { font-family: var(--font-mono); font-weight: 600; background: var(--ink); color: var(--bg); padding: 3px 12px; border-radius: 999px; }
.streak { font-family: var(--font-mono); font-weight: 600; background: var(--c); color: #14132e; padding: 3px 12px; border-radius: 999px; border: 2px solid var(--edge); }
.bar { height: 12px; background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, #14132e 10px 20px); }
.nav { display: flex; flex-wrap: wrap; gap: 5px; }
.nav button { width: 34px; height: 30px; border-radius: 8px; border: 2px solid var(--edge); background: var(--surface); font-family: var(--font-mono); font-size: 12px; font-weight: 600; padding: 0; }
.nav button.done { background: var(--accent); color: var(--on-accent); }
.nav button.ok { background: var(--good); color: #fff; }
.nav button.no { background: var(--bad); color: #fff; }
.nav button.cur { box-shadow: 3px 3px 0 var(--shadow); transform: translate(-2px, -2px); }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; padding: 3px 12px; border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); }
.tag.lec { background: var(--b); color: #14132e; }
.tag.kind { background: var(--accent); color: var(--on-accent); }
.qtext { font-size: 21px; font-weight: 700; line-height: 1.35; max-width: 62ch; }
.opts { display: flex; flex-direction: column; gap: 14px; }
.opt { --lc: var(--a); display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 2.5px solid var(--edge); border-radius: 16px; padding: 14px;
  box-shadow: 5px 5px 0 var(--lc); transition: transform .08s, box-shadow .08s; }
.opt.l1 { --lc: var(--b); } .opt.l2 { --lc: var(--c); } .opt.l3 { --lc: var(--d); }
.opt:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--lc); }
.opt:disabled { cursor: default; }
.opt .let { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 2.5px solid var(--edge); background: var(--lc); color: #14132e; display: grid; place-items: center; font-family: var(--font-display); font-size: 16px; }
.opt .body { flex: 1; min-width: 0; padding-top: 6px; font-weight: 500; }
.opt:has(pre) .body { padding-top: 0; }
.opt.sel { background: var(--accent-soft); transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--lc); }
.opt.ok { background: var(--good-soft); box-shadow: 5px 5px 0 var(--good); }
.opt.ok .let { background: var(--good); color: #fff; }
.opt.no { background: var(--bad-soft); box-shadow: 5px 5px 0 var(--bad); }
.opt.no .let { background: var(--bad); color: #fff; }
.opt.dim { opacity: .55; box-shadow: none; }
pre { margin: 0; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.5; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre; tab-size: 4; }
pre .k { color: #ff8fb1; } pre .s { color: #a5e887; } pre .n { color: #ffc66d; } pre .c { color: #8189b3; font-style: italic; }
pre.qcode { border: 2.5px solid var(--edge); box-shadow: 5px 5px 0 var(--shadow); max-width: 100%; position: relative; padding-top: 30px; }
pre.qcode::before { content: "main.cpp"; position: absolute; top: 6px; left: 14px; font-size: 11px; color: #8189b3; }
.verdict { border: 2.5px solid var(--edge); padding: 12px 16px; border-radius: 14px; background: var(--surface); }
.verdict.ok { background: var(--good-soft); } .verdict.no { background: var(--bad-soft); }
.verdict b.ok { color: var(--good); } .verdict b.no { color: var(--bad); }
.verdict b { font-family: var(--font-display); font-weight: 400; }

/* results */
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 2.5px solid var(--edge); border-radius: 16px; padding: 14px 16px; box-shadow: 4px 4px 0 var(--shadow); }
.tile .big { font-family: var(--font-display); font-size: 32px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile:nth-child(2) { background: color-mix(in srgb, var(--b) 22%, var(--surface)); }
.tile:nth-child(3) { background: color-mix(in srgb, var(--a) 20%, var(--surface)); }
.tile:nth-child(4) { background: color-mix(in srgb, var(--d) 20%, var(--surface)); }
.tile.grade { background: var(--accent); color: var(--on-accent); }
.tile.grade .big { font-size: 56px; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 62px; gap: 12px; align-items: center; }
.lrow .bar > i { background: var(--accent); } .lrow .bar > i.low { background: var(--bad); } .lrow .bar > i.high { background: var(--good); }
.review { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 2px dashed var(--edge); }
.review:first-of-type { border-top: 0; padding-top: 0; }
.lab { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.lab.ok { color: var(--good); } .lab.no { color: var(--bad); }
.overlay { position: fixed; inset: 0; background: rgba(12, 12, 30, .6); display: grid; place-items: center; padding: 16px; z-index: 20; }
.overlay .card { max-width: 440px; width: 100%; }
textarea { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 2.5px solid var(--edge); border-radius: 12px; padding: 10px; min-height: 120px; }
.tablewrap { overflow-x: auto; border: 2.5px solid var(--edge); border-radius: 16px; background: var(--surface); box-shadow: 6px 6px 0 var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 2px solid color-mix(in srgb, var(--edge) 25%, transparent); white-space: nowrap; }
th { font-family: var(--font-mono); font-size: 12.5px; background: var(--accent); color: var(--on-accent); border-bottom: 2.5px solid var(--edge); }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-block; min-width: 30px; text-align: center; padding: 1px 9px; border-radius: 999px; font-weight: 700; border: 2px solid var(--edge); }
.pill.g5, .pill.g4 { background: var(--good-soft); color: var(--good); }
.pill.g3 { background: var(--accent-soft); }
.pill.g2, .pill.g1 { background: var(--bad-soft); color: var(--bad); }
.note { border: 2.5px solid var(--edge); padding: 10px 14px; background: var(--surface); border-radius: 12px; }
.note.ok { background: var(--good-soft); } .note.no { background: var(--bad-soft); }

@media (prefers-reduced-motion: no-preference) {
  .bar > i { transition: width .3s; }
  .opt.fresh.ok { animation: pop .35s ease-out; }
  .opt.fresh.no { animation: shake .35s; }
  .tile.grade { animation: stamp .55s cubic-bezier(.2, 1.6, .4, 1) both; }
  .hero svg .leg { animation: wiggle 1.2s ease-in-out infinite alternate; transform-origin: 60px 64px; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.025); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  @keyframes stamp { 0% { transform: scale(2.2) rotate(-14deg); opacity: 0; } 100% { transform: scale(1) rotate(-3deg); opacity: 1; } }
  @keyframes wiggle { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
}
.tile.grade { transform: rotate(-3deg); }
</style>
</head>
<body>
<main id="app"></main>
<script>

 {"l": 4, "k": "code", "q": "Какой фрагмент компилируется?", "o": ["int number = 5;\ndouble result = number * 1.5;\ncout << result;", "int return = 5;\ndouble result = return * 1.5;\ncout << result;", "int class = 5;\ndouble result = class * 1.5;\ncout << result;", "int for = 5;\ndouble result = for * 1.5;\ncout << result;"], "e": "return, class и for - ключевые слова, их нельзя использовать как имена переменных."}, {"l": 4, "k": "code", "q": "Какой фрагмент компилируется и выводит 10?", "o": ["int sum = 10;\ncout << sum;", "int sum = 10;\ncout << Sum;", "Int sum = 10;\ncout << sum;", "int sum = 10;\nCout << sum;"], "e": "C++ различает регистр: Sum, Int и Cout - это не sum, int и cout."}, {"l": 4, "k": "code", "q": "В каком фрагменте комментарии записаны правильно и программа выводит 15?", "o": ["// Площадь прямоугольника\nint a = 5, b = 3;\n/* вычисление и вывод */\ncout << a * b;", "// Площадь прямоугольника\nint a = 5, b = 3;\n/* вычисление и вывод\ncout << a * b;", "\\\\ Площадь прямоугольника\nint a = 5, b = 3;\ncout << a * b;", "int a = 5; // ширина int b = 3;\n/* вычисление и вывод */\ncout << a * b;"], "e": "Ошибки: комментарий /* не закрыт; комментарий начинается с //, а не с \\\\; объявление b оказалось внутри комментария."}, {"l": 4, "k": "code", "q": "Какая программа правильно оформляет функцию main?", "o": ["#include <iostream>\nusing namespace std;\n\nint main() {\n    int a = 5;\n    int b = 7;\n    cout << a + b << endl;\n    return 0;\n}", "#include <iostream>\nusing namespace std;\n\nint Main() {\n    int a = 5;\n    int b = 7;\n    cout << a + b << endl;\n    return 0;\n}", "#include <iostream>\nusing namespace std;\n\nint main {\n    int a = 5;\n    int b = 7;\n    cout << a + b << endl;\n    return 0;\n}", "#include <iostream>\nusing namespace std;\n\nint main() {\n    int a = 5;\n    int b = 7;\n    cout << a + b << endl;\n    return 0;"], "e": "Ошибки: Main с прописной буквы не является главной функцией; после main пропущены круглые скобки; не закрыта фигурная скобка."}, {"l": 4, "k": "code", "q": "Какой фрагмент компилируется и выводит строку Sum = 12?", "o": ["int sum = 12;\ncout << \"Sum = \" << sum << endl;", "int sum = 12;\ncout << \"Sum = \" sum << endl;", "int sum = 12;\ncout << \"Sum = \" << \"sum\" << endl;", "int sum = 12;\ncout << Sum = << sum << endl;"], "e": "Ошибки: пропущен оператор << между частями вывода; \"sum\" в кавычках - это текст, а не значение переменной; текст записан без кавычек."}, {"l": 4, "k": "code", "q": "Какой фрагмент карточки студента компилируется?", "o": ["string name = \"Ali\";\nint age = 18;\ncout << name << \", \" << age << endl;", "String name = \"Ali\";\nint age = 18;\ncout << name << \", \" << age << endl;", "string name = \"Ali\";\nint age = \"18\";\ncout << name << \", \" << age << endl;", "string name = \"Ali\"\nint age = 18;\ncout << name << \", \" << age << endl;"], "e": "Ошибки: тип пишется string со строчной буквы; строку \"18\" нельзя записать в int; пропущена точка с запятой."}, {"l": 5, "k": "theory", "q": "Какой тип данных лучше выбрать для хранения среднего балла студента?", "o": ["double", "int", "char", "bool"], "e": "Средний балл может быть дробным; int отбросит дробную часть."}, {"l": 5, "k": "theory", "q": "Что содержит локальная переменная, объявленная как int x; без инициализации?", "o": ["Неопределённое значение", "Всегда 0", "Всегда -1", "Ничего: такая запись не компилируется"], "e": "Неинициализированная локальная переменная фундаментального типа содержит неопределённое значение."}, {"l": 5, "k": "code", "q": "В каком фрагменте переменная объявлена правильно?", "o": ["int age = 18;\ncout << age;", "age int = 18;\ncout << age;", "int age == 18;\ncout << age;", "integer age = 18;\ncout << age;"], "e": "Общий вид: тип имя = значение; тип называется int, а == - это сравнение, а не инициализация."}, {"l": 5, "k": "code", "q": "Какой фрагмент компилируется и выводит 3.7, не теряя дробную часть?", "o": ["double x{3.7};\ncout << x;", "int x{3.7};\ncout << x;", "int x = 3.7;\ncout << x;", "int x(3.7);\ncout << x;"], "e": "Списочная инициализация int x{3.7} запрещена (сужающее преобразование); int x = 3.7 и int x(3.7) компилируются, но выводят 3."}, {"l": 5, "k": "code", "q": "Какой фрагмент гарантированно выводит 15?", "o": ["int x = 10;\nint y = x + 5;\ncout << y;", "int x;\nint y = x + 5;\ncout << y;", "int y = x + 5;\nint x = 10;\ncout << y;", "int x = 10;\nint y;\ncout << y;\ny = x + 5;"], "e": "Ошибки: x используется без инициализации; x используется до объявления; y выводится раньше, чем получает значение."}, {"l": 5, "k": "code", "q": "Какой фрагмент компилируется с учётом области видимости переменных?", "o": ["int x = 5;\n{\n    int y = x * 2;\n    cout << y;\n}", "int x = 5;\n{\n    int y = x * 2;\n}\ncout << y;", "int x = 5;\nint x = 10;\ncout << x;", "{\n    int x = 5;\n}\nint y = x * 2;\ncout << y;"], "e": "Переменная, объявленная внутри блока { }, вне блока недоступна; одно имя нельзя объявить дважды в одном блоке."}, {"l": 5, "k": "code", "q": "Даны int a = 5, b = 2. Какой фрагмент компилируется и выводит 2.5?", "o": ["int a = 5, b = 2;\ncout << static_cast<double>(a) / b;", "int a = 5, b = 2;\ncout << a / b;", "int a = 5, b = 2;\ncout << static_cast<double>(a / b);", "int a = 5, b = 2;\ncout << static_cast<double> a / b;"], "e": "a / b для целых даёт 2; преобразовывать нужно операнд до деления, а не результат; аргумент static_cast пишут в круглых скобках."}, {"l": 5, "k": "code", "q": "Какой фрагмент правильно считывает целое число с клавиатуры?", "o": ["int age;\ncin >> age;\ncout << age;", "int age;\ncin << age;\ncout << age;", "int age;\ncin >> \"age\";\ncout << age;", "cin >> age;\nint age;\ncout << age;"], "e": "Для ввода используется cin >> имя_переменной; переменная должна быть объявлена до ввода."}, {"l": 5, "k": "code", "q": "Пользователь вводит имя и фамилию через пробел: Ali Valiev. Какой фрагмент компилируется и считывает всю строку?", "o": ["string name;\ngetline(cin, name);\ncout << name;", "string name;\ncin >> name;\ncout << name;", "string name;\ngetline(name);\ncout << name;", "string name;\ngetline(cin >> name);\ncout << name;"], "e": "cin >> читает только до пробела (Ali); строку с пробелами читает getline(cin, name)."}, {"l": 5, "k": "code", "q": "Какой фрагмент компилируется и выводит символ B?", "o": ["char c = 'A';\nc = c + 1;\ncout << c;", "char c = 'A';\ncout << c + 1;", "char c = \"A\";\nc = c + 1;\ncout << c;", "char c = 'A';\nc = c + '1';\ncout << c;"], "e": "Выражение c + 1 имеет тип int и выводится как число 66; \"A\" - строка; '1' - символ с кодом 49, а не число 1."}, {"l": 6, "k": "theory", "q": "Чему равно значение выражения 7 / 2 в C++, если оба операнда имеют тип int?", "o": ["3", "3.5", "4", "1"], "e": "При делении целых дробная часть отбрасывается."}, {"l": 6, "k": "theory", "q": "Чему равно x после выполнения: int x = 5; x += 3; x *= 2; ?", "o": ["16", "11", "13", "10"], "e": "x = 5 + 3 = 8, затем 8 * 2 = 16."}, {"l": 6, "k": "code", "q": "Какой фрагмент с constexpr компилируется?", "o": ["constexpr int MINUTES_IN_DAY = 24 * 60;\ncout << MINUTES_IN_DAY;", "int hours;\ncin >> hours;\nconstexpr int MINUTES = hours * 60;\ncout << MINUTES;", "constexpr int MINUTES_IN_DAY;\nMINUTES_IN_DAY = 24 * 60;\ncout << MINUTES_IN_DAY;", "constexpr int MINUTES_IN_DAY = 24 * 60;\nMINUTES_IN_DAY = MINUTES_IN_DAY + 1;\ncout << MINUTES_IN_DAY;"], "e": "Значение constexpr должно быть известно на этапе компиляции (не из ввода), задаётся сразу и не изменяется."}, {"l": 6, "k": "code", "q": "В каком фрагменте операция присваивания записана правильно?", "o": ["int a = 5, b = 3;\nint sum;\nsum = a + b;\ncout << sum;", "int a = 5, b = 3;\nint sum;\na + b = sum;\ncout << sum;", "int a = 5, b = 3;\nint sum;\n8 = sum;\ncout << sum;", "int a = 5, b = 3;\nint sum;\nsum == a + b;\ncout << sum;"], "e": "Слева от = должен стоять объект (переменная), а не выражение или литерал; == - это сравнение, оно ничего не записывает в sum."}, {"l": 6, "k": "code", "q": "Какой фрагмент правильно меняет местами значения a и b (должно получиться 7 3)?", "o": ["int a = 3, b = 7;\nint t = a;\na = b;\nb = t;\ncout << a << \" \" << b;", "int a = 3, b = 7;\na = b;\nb = a;\ncout << a << \" \" << b;", "int a = 3, b = 7;\nint t = a;\nb = t;\na = b;\ncout << a << \" \" << b;", "int a = 3, b = 7;\nint t = a;\na = b;\nb = a;\ncout << a << \" \" << b;"], "e": "Без временной переменной старое значение a теряется; в конце нужно записать в b сохранённое значение t."}, {"l": 6, "k": "code", "q": "Какой фрагмент компилируется и увеличивает x на 5 (выводит 15)?", "o": ["int x = 10;\nx += 5;\ncout << x;", "int x = 10;\nx =+ 5;\ncout << x;", "int x = 10;\nx + 5;\ncout << x;", "int x = 10;\nx + = 5;\ncout << x;"], "e": "x =+ 5 присваивает +5; x + 5 вычисляет значение, но не сохраняет его; оператор += пишется без пробела."}, {"l": 6, "k": "code", "q": "Даны оценки 4, 5 и 5. Какой фрагмент выводит правильный средний балл 4.66667?", "o": ["int a = 4, b = 5, c = 5;\ndouble avg = (a + b + c) / 3.0;\ncout << avg;", "int a = 4, b = 5, c = 5;\ndouble avg = (a + b + c) / 3;\ncout << avg;", "int a = 4, b = 5, c = 5;\ndouble avg = a + b + c / 3.0;\ncout << avg;", "int a = 4, b = 5, c = 5;\nint avg = (a + b + c) / 3.0;\ncout << avg;"], "e": "Ошибки: целочисленное деление на 3; без скобок делится только c; результат записан в int и теряет дробную часть."}, {"l": 6, "k": "code", "q": "Нужно перевести 25 градусов Цельсия в Фаренгейты по формуле F = C * 9 / 5 + 32 (ответ 77). Какой фрагмент считает верно?", "o": ["int c = 25;\ndouble f = c * 9.0 / 5 + 32;\ncout << f;", "int c = 25;\ndouble f = c * (9 / 5) + 32;\ncout << f;", "int c = 25;\ndouble f = c * 9.0 / (5 + 32);\ncout << f;", "int c = 25;\ndouble f = 9 / 5 * c + 32;\ncout << f;"], "e": "9 / 5 для целых равно 1, поэтому получается 57; лишние скобки (5 + 32) меняют порядок действий."}, {"l": 6, "k": "code", "q": "Нужно перевести 3725 секунд в часы, минуты и секунды (1 2 5). Какой фрагмент компилируется и считает верно?", "o": ["int total = 3725;\nint h = total / 3600;\nint m = total % 3600 / 60;\nint s = total % 60;\ncout << h << \" \" << m << \" \" << s;", "int total = 3725;\nint h = total / 3600;\nint m = total / 60;\nint s = total % 60;\ncout << h << \" \" << m << \" \" << s;", "int total = 3725;\nint h = total % 3600;\nint m = total % 3600 / 60;\nint s = total % 60;\ncout << h << \" \" << m << \" \" << s;", "double total = 3725;\nint h = total / 3600;\nint m = total % 3600 / 60;\nint s = total % 60;\ncout << h << \" \" << m << \" \" << s;"], "e": "Ошибки: минуты посчитаны без вычитания целых часов (62); часы найдены через остаток вместо деления; операция % не применяется к double."}, {"l": 6, "k": "code", "q": "Цена товара 200, скидка 10 %. Какой фрагмент компилируется и выводит цену со скидкой 180?", "o": ["const double DISCOUNT = 0.1;\ndouble price = 200;\ndouble total = price - price * DISCOUNT;\ncout << total;", "const int DISCOUNT = 10;\ndouble price = 200;\ndouble total = price - price * (DISCOUNT / 100);\ncout << total;", "const double DISCOUNT = 0.1;\ndouble price = 200;\nDISCOUNT = DISCOUNT * price;\ndouble total = price - DISCOUNT;\ncout << total;", "const double DISCOUNT = 0.1;\ndouble price = 200;\ndouble total = price - DISCOUNT;\ncout << total;"], "e": "Ошибки: 10 / 100 для целых равно 0; константу нельзя изменять; из цены вычтена доля 0.1, а не сумма скидки."}, {"l": 7, "k": "theory", "q": "Какой спецификатор формата используют в scanf для ввода значения типа double?", "o": ["%lf", "%d", "%f", "%c"], "e": "В scanf для double нужен %lf; %f - для float, %d - для int, %c - для символа."}, {"l": 7, "k": "theory", "q": "Зачем перед именем переменной в scanf(\"%d\", &a) ставят знак &?", "o": ["Чтобы передать адрес переменной, по которому scanf запишет введённое значение", "Чтобы вывести значение переменной на экран", "Чтобы преобразовать переменную к целому типу", "Это логическая операция И, которая проверяет правильность ввода"], "e": "scanf должен знать адрес памяти, куда записать значение."}, {"l": 7, "k": "code", "q": "Какая программа компилируется и правильно выводит x = 10?", "o": ["#include <cstdio>\n\nint main() {\n    int x = 10;\n    printf(\"x = %d\\n\", x);\n    return 0;\n}", "int main() {\n    int x = 10;\n    printf(\"x = %d\\n\", x);\n    return 0;\n}", "#include <cstdio>\n\nint main() {\n    int x = 10;\n    printf(\"x = %f\\n\", x);\n    return 0;\n}", "#include <cstdio>\n\nint main() {\n    int x = 10;\n    print(\"x = %d\\n\", x);\n    return 0;\n}"], "e": "Ошибки: не подключён <cstdio>; для int указан формат %f; функция называется printf."}, {"l": 7, "k": "code", "q": "Какой фрагмент правильно считывает целое число и выводит его?", "o": ["int a;\nscanf(\"%d\", &a);\nprintf(\"%d\\n\", a);", "int a;\nscanf(\"%d\", a);\nprintf(\"%d\\n\", a);", "int a;\nscanf(\"%f\", &a);\nprintf(\"%d\\n\", a);", "int a;\nscanf(%d, &a);\nprintf(\"%d\\n\", a);"], "e": "Ошибки: забыт знак & перед переменной; для int указан формат %f; строка формата записана без кавычек."}, {"l": 7, "k": "code", "q": "Какой фрагмент правильно считывает число типа double и выводит его с двумя знаками после точки?", "o": ["double d;\nscanf(\"%lf\", &d);\nprintf(\"%.2f\\n\", d);", "double d;\nscanf(\"%f\", &d);\nprintf(\"%.2f\\n\", d);", "double d;\nscanf(\"%d\", &d);\nprintf(\"%.2f\\n\", d);", "double d;\nscanf(\"%lf\", d);\nprintf(\"%.2f\\n\", d);"], "e": "Для double в scanf нужен именно %lf и адрес переменной (&d); %f и %d записывают данные неверно."}, {"l": 7, "k": "code", "q": "Дано double pi = 3.14159;. Какой фрагмент выводит 3.14?", "o": ["double pi = 3.14159;\nprintf(\"%.2f\\n\", pi);", "double pi = 3.14159;\nprintf(\"%2f\\n\", pi);", "double pi = 3.14159;\nprintf(\"%.2d\\n\", pi);", "double pi = 3.14159;\nprintf(\"%f.2\\n\", pi);"], "e": "Точность задают как %.2f; %2f - это ширина поля, %d - формат для int, а .2 после %f выводится как обычный текст."}, {"l": 7, "k": "code", "q": "Дано int p = 50;. Какой фрагмент компилируется и выводит строку Progress 50% ?", "o": ["int p = 50;\nprintf(\"Progress %d%%\\n\", p);", "int p = 50;\nprintf(\"Progress p%%\\n\");", "int p = 50;\nprintf(\"Progress %%d\\n\", p);", "int p = 50;\nprintf(\"Progress %d%%\\n\" p);"], "e": "Значение подставляется вместо %d, а знак процента выводится как %%; запись %%d печатает текст %d; между строкой формата и аргументом нужна запятая."}, {"l": 7, "k": "code", "q": "Пользователь вводит число, нажимает Enter и вводит знак операции. Какой фрагмент правильно считывает оба значения?", "o": ["int n;\nchar op;\nscanf(\"%d\", &n);\nscanf(\" %c\", &op);\nprintf(\"%d %c\\n\", n, op);", "int n;\nchar op;\nscanf(\"%d\", &n);\nscanf(\"%c\", &op);\nprintf(\"%d %c\\n\", n, op);", "int n;\nchar op;\nscanf(\"%d\", &n);\nscanf(\" %c\", op);\nprintf(\"%d %c\\n\", n, op);", "int n;\nchar op;\nscanf(\"%d\", &n);\nscanf(\" %d\", &op);\nprintf(\"%d %c\\n\", n, op);"], "e": "%c без пробела считывает оставшийся в буфере Enter; пробел перед %c пропускает его. Также нужны & и формат %c для char."}, {"l": 7, "k": "code", "q": "Какой фрагмент правильно считывает два целых числа и выводит их сумму?", "o": ["int a, b;\nscanf(\"%d %d\", &a, &b);\nprintf(\"%d\\n\", a + b);", "int a, b;\nscanf(\"%d %d\", &a);\nprintf(\"%d\\n\", a + b);", "int a, b;\nscanf(\"%d %d\", &a, &b);\nprintf(\"%d\\n\", a, b);", "int a, b;\nscanf(\"%d %d\", a, b);\nprintf(\"%d\\n\", a + b);"], "e": "Количество спецификаторов должно совпадать с количеством аргументов; в scanf передают адреса (&a, &b)."}, {"l": 7, "k": "code", "q": "Какой фрагмент правильно считывает слово в массив символов и выводит приветствие?", "o": ["char name[20];\nscanf(\"%19s\", name);\nprintf(\"Hello, %s!\\n\", name);", "char name;\nscanf(\"%19s\", &name);\nprintf(\"Hello, %s!\\n\", name);", "char name[20];\nscanf(\"%19s\", name);\nprintf(\"Hello, %d!\\n\", name);", "char name[20];\nscanf(\"%19s\", name);\nprintf(\"Hello, name!\\n\");"], "e": "Для слова нужен массив char, а не один символ; строку выводят через %s; имя переменной внутри кавычек выводится как обычный текст."}, {"l": 8, "k": "theory", "q": "Какой тип имеет результат операции отношения, например a > b?", "o": ["bool", "int", "double", "char"], "e": "Операции отношения возвращают true или false."}, {"l": 8, "k": "theory", "q": "Какое выражение по закону де Моргана равносильно !(a && b)?", "o": ["!a || !b", "!a && !b", "a || b", "!(a || b)"], "e": "При отрицании И заменяется на ИЛИ, и отрицается каждое условие."}, {"l": 8, "k": "theory", "q": "Вычисляется условие a != 0 && b / a > 2 при a = 0. Что произойдёт?", "o": ["Вторая часть не вычисляется, результат false - это короткое вычисление", "Произойдёт деление на ноль", "Сначала вычисляется b / a > 2, затем a != 0", "Программа не скомпилируется"], "e": "Если левая часть && равна false, правая часть не вычисляется."}, {"l": 8, "k": "code", "q": "Дано int x = 3. Какой фрагмент компилируется и выводит other?", "o": ["int x = 3;\nif (x == 5) cout << \"five\";\nelse cout << \"other\";", "int x = 3;\nif (x = 5) cout << \"five\";\nelse cout << \"other\";", "int x = 3;\nif (x === 5) cout << \"five\";\nelse cout << \"other\";", "int x = 3;\nif x == 5 cout << \"five\";\nelse cout << \"other\";"], "e": "= - это присваивание (условие становится истинным), сравнение - это ==; оператора === в C++ нет; условие пишут в круглых скобках."}, {"l": 8, "k": "code", "q": "Дано int x = 150. Какой фрагмент правильно проверяет, что x лежит в диапазоне от 1 до 100 (должен вывести no)?", "o": ["int x = 150;\nif (x >= 1 && x <= 100) cout << \"yes\";\nelse cout << \"no\";", "int x = 150;\nif (1 <= x <= 100) cout << \"yes\";\nelse cout << \"no\";", "int x = 150;\nif (x >= 1 || x <= 100) cout << \"yes\";\nelse cout << \"no\";", "int x = 150;\nif (x >= 1 && <= 100) cout << \"yes\";\nelse cout << \"no\";"], "e": "Запись 1 <= x <= 100 сравнивает с 100 результат первого сравнения (0 или 1); с || условие истинно всегда; в каждом сравнении нужны оба операнда."}, {"l": 8, "k": "code", "q": "Дано int a - b; break;\n    default: cout << \"error\";\n}", "char op = '+';\nint a = 6, b = 2;\nswitch (op) {\n    case \"+\": cout << a + b; break;\n    case \"-\": cout << a - b; break;\n    default: cout << \"error\";\n}", "char op = '+';\nint a = 6, b = 2;\nswitch (op) {\n    case +: cout << a + b; break;\n    case -: cout << a - b; break;\n    default: cout << \"error\";\n}"], "e": "switch работает с целыми и символьными значениями, но не со string; метки для char пишут в одинарных кавычках."}, {"l": 9, "k": "code", "q": "Даны a = 10, b = 0. Какой фрагмент компилируется и защищает программу от деления на ноль (выводит error)?", "o": ["int a = 10, b = 0;\nif (b != 0) cout << a / b;\nelse cout << \"error\";", "int a = 10, b = 0;\nif (b = 0) cout << \"error\";\nelse cout << a / b;", "int a = 10, b = 0;\ncout << a / b;\nif (b == 0) cout << \"error\";", "int a = 10, b = 0;\nif (b != 0) cout << a / b\nelse cout << \"error\";"], "e": "Ошибки: b = 0 - присваивание, условие ложно, и выполняется деление; проверка стоит после деления; пропущена точка с запятой."}, {"l": 9, "k": "code", "q": "Какой фрагмент компилируется и правильно определяет високосный год (1900 - нет, 2000 - да, 2024 - да)?", "o": ["int year;\ncin >> year;\nif ((year % 4 == 0 && year % 100 != 0) || year % 400 == 0)\n    cout << \"leap\";\nelse\n    cout << \"not leap\";", "int year;\ncin >> year;\nif (year % 4 == 0)\n    cout << \"leap\";\nelse\n    cout << \"not leap\";", "int year;\ncin >> year;\nif (year % 4 == 0 && year % 100 != 0 && year % 400 == 0)\n    cout << \"leap\";\nelse\n    cout << \"not leap\";", "int year;\ncin >> year;\nif ((year % 4 = 0 && year % 100 != 0) || year % 400 = 0)\n    cout << \"leap\";\nelse\n    cout << \"not leap\";"], "e": "Год високосный, если делится на 4 и не делится на 100, либо делится на 400; одно условие % 4 ошибается на 1900, три && - на 2000 и 2024."}, {"l": 10, "k": "theory", "q": "Чем цикл do-while отличается от цикла while?", "o": ["В do-while условие проверяется после тела цикла, поэтому тело выполняется минимум один раз", "В do-while условие проверяется до тела цикла", "do-while всегда выполняется бесконечно", "В do-while нельзя использовать break и continue"], "e": "while сначала проверяет условие, do-while сначала выполняет тело."}, {"l": 10, "k": "theory", "q": "Что делает оператор continue внутри цикла?", "o": ["Пропускает оставшуюся часть тела и переходит к следующей итерации", "Немедленно завершает цикл", "Завершает всю программу", "Запускает цикл заново с начальным значением счётчика"], "e": "continue переходит к следующей итерации, цикл завершает break."}, {"l": 10, "k": "code", "q": "Какой фрагмент компилируется и выводит числа 1 2 3 4 5?", "o": ["int i = 1;\nwhile (i <= 5) {\n    cout << i << \" \";\n    i++;\n}", "int i = 1;\nwhile (i <= 5) {\n    cout << i << \" \";\n}", "int i = 1;\nwhile (i < 5) {\n    cout << i << \" \";\n    i++;\n}", "int i = 1;\nwhile i <= 5 {\n    cout << i << \" \";\n    i++;\n}"], "e": "Ошибки: счётчик не изменяется - бесконечный цикл; условие i < 5 не выводит 5; условие while пишут в круглых скобках."}, {"l": 10, "k": "code", "q": "Пользователь вводит n = 5. Какой фрагмент правильно находит сумму чисел от 1 до n (15)?", "o": ["int n, sum = 0, i = 1;\ncin >> n;\nwhile (i <= n) {\n    sum += i;\n    i++;\n}\ncout << sum;", "int n, sum, i = 1;\ncin >> n;\nwhile (i <= n) {\n    sum += i;\n    i++;\n}\ncout << sum;", "int n, sum = 0, i = 1;\ncin >> n;\nwhile (i <= n) {\n    sum = i;\n    i++;\n}\ncout << sum;", "int n, sum = 0, i = 1;\ncin >> n;\nwhile (i < n) {\n    sum += i;\n    i++;\n}\ncout << sum;"], "e": "Ошибки: sum не инициализирована нулём; sum = i не накапливает сумму; при i < n последнее число не прибавляется."}, {"l": 10, "k": "code", "q": "Какой фрагмент правильно вычисляет факториал числа 5 (120)?", "o": ["int n = 5, i = 1;\nlong long f = 1;\nwhile (i <= n) {\n    f *= i;\n    i++;\n}\ncout << f;", "int n = 5, i = 1;\nlong long f = 0;\nwhile (i <= n) {\n    f *= i;\n    i++;\n}\ncout << f;", "int n = 5, i = 1;\nlong long f = 1;\nwhile (i <= n) {\n    i++;\n    f *= i;\n}\ncout << f;", "int n = 5, i = 1;\nlong long f = 1;\nwhile (i <= n)\n    f *= i;\n    i++;\ncout << f;"], "e": "Ошибки: при f = 0 произведение всегда 0; i увеличивается до умножения (получается 720); без { } в теле цикла только f *= i - цикл бесконечный."}, {"l": 10, "k": "code", "q": "В каком фрагменте цикл do-while записан без синтаксических ошибок?", "o": ["int age;\ndo {\n    cin >> age;\n} while (age < 0);\ncout << age;", "int age;\ndo {\n    cin >> age;\n} while (age < 0)\ncout << age;", "int age;\ndo {\n    cin >> age;\n} (age < 0);\ncout << age;", "int age;\ndo while (age < 0) {\n    cin >> age;\n}\ncout << age;"], "e": "Форма записи: do { тело } while (условие); - со словом while после тела и обязательной точкой с запятой."}, {"l": 10, "k": "code", "q": "Какой фрагмент правильно считает количество цифр числа 4096 (4)?", "o": ["int n = 4096, count = 0;\nwhile (n > 0) {\n    count++;\n    n /= 10;\n}\ncout << count;", "int n = 4096, count = 0;\nwhile (n > 0) {\n    count++;\n    n %= 10;\n}\ncout << count;", "int n = 4096, count = 0;\nwhile (n > 0) {\n    n /= 10;\n}\ncount++;\ncout << count;", "int n = 4096, count = 0;\nwhile (n >= 0) {\n    count++;\n    n /= 10;\n}\ncout << count;"], "e": "Ошибки: n %= 10 не уменьшает число до нуля - цикл бесконечный; count++ стоит вне цикла; при n >= 0 цикл не завершается."}, {"l": 10, "k": "code", "q": "Какой фрагмент правильно переворачивает число 123 (выводит 321)?", "o": ["int n = 123, rev = 0;\nwhile (n > 0) {\n    rev = rev * 10 + n % 10;\n    n /= 10;\n}\ncout << rev;", "int n = 123, rev = 0;\nwhile (n > 0) {\n    rev = rev + n % 10;\n    n /= 10;\n}\ncout << rev;", "int n = 123, rev = 0;\nwhile (n > 0) {\n    rev = rev * 10 + n / 10;\n    n /= 10;\n}\ncout << rev;", "int n = 123, rev = 0;\nwhile (n > 0) {\n    n /= 10;\n    rev = rev * 10 + n % 10;\n}\ncout << rev;"], "e": "Ошибки: без умножения на 10 получается сумма цифр; последняя цифра - это n % 10, а не n / 10; цифру нужно взять до деления n на 10."}, {"l": 10, "k": "code", "q": "Какой фрагмент правильно находит НОД чисел 48 и 18 по алгоритму Евклида (6)?", "o": ["int a = 48, b = 18;\nwhile (b != 0) {\n    int t = a % b;\n    a = b;\n    b = t;\n}\ncout << a;", "int a = 48, b = 18;\nwhile (b != 0) {\n    a = b;\n    b = a % b;\n}\ncout << a;", "int a = 48, b = 18;\nwhile (b = 0) {\n    int t = a % b;\n    a = b;\n    b = t;\n}\ncout << a;", "int a = 48, b = 18;\nwhile (b != 0) {\n    int t = a / b;\n    a = b;\n    b = t;\n}\ncout << a;"], "e": "Ошибки: остаток считается уже после изменения a; b = 0 - присваивание, цикл не выполняется; в алгоритме нужен остаток %, а не частное."}, {"l": 10, "k": "code", "q": "Какой фрагмент компилируется и выводит только нечётные числа 1 3 5 7 9?", "o": ["int i = 0;\nwhile (i < 9) {\n    i++;\n    if (i % 2 == 0) continue;\n    cout << i << \" \";\n}", "int i = 1;\nwhile (i <= 9) {\n    if (i % 2 == 0) continue;\n    cout << i << \" \";\n    i++;\n}", "int i = 0;\nwhile (i < 9) {\n    i++;\n    if (i % 2 == 0) break;\n    cout << i << \" \";\n}", "int i = 0;\nwhile (i < 9) {\n    i++;\n    if (i % 2 == 0) continue\n    cout << i << \" \";\n}"], "e": "Ошибки: continue срабатывает до i++ - цикл зависает на числе 2; break завершает цикл после первого числа; пропущена точка с запятой."}, {"l": 1, "k": "theory", "q": "Что означает свойство дискретности алгоритма?", "o": ["Решение разбито на отдельные шаги", "Алгоритм даёт результат", "Алгоритм работает с разными данными", "Каждая команда понимается однозначно"], "e": "Дискретность - разбиение на отдельные шаги."}, {"l": 1, "k": "theory", "q": "Что означает свойство конечности алгоритма?", "o": ["Алгоритм завершается за конечное число шагов", "Алгоритм состоит из одной команды", "Алгоритм решает только одну задачу", "В алгоритме нет циклов"], "e": "Алгоритм обязан завершиться."}, {"l": 1, "k": "theory", "q": "Алгоритм: «x = 5; пока x > 0, увеличиват асть пишется через точку."}, {"l": 6, "k": "code", "q": "Дано n = 537. Какой фрагмент компилируется и выводит цифру десятков и цифру единиц: 37?", "o": ["int n = 537;\nint last = n % 10;\nint tens = n / 10 % 10;\ncout << tens << last;", "int n = 537;\nint last = n % 10;\nint tens = n % 10 / 10;\ncout << tens << last;", "int n = 537;\nint last = n / 10;\nint tens = n / 10 % 10;\ncout << tens << last;", "int n = 537;\nint last = n mod 10;\nint tens = n / 10 % 10;\ncout << tens << last;"], "e": "Последняя цифра - n % 10; цифра десятков - (n / 10) % 10; оператора mod в C++ нет."}, {"l": 6, "k": "code", "q": "Даны sum = 14 и count = 4. Какой фрагмент компилируется и выводит среднее 3.5?", "o": ["int sum = 14, count = 4;\ndouble avg = 1.0 * sum / count;\ncout << avg;", "int sum = 14, count = 4;\ndouble avg = sum / count * 1.0;\ncout << avg;", "int sum = 14, count = 4;\ndouble avg = sum / count;\ncout << avg;", "int sum = 14, count = 4;\ndouble avg = 1,0 * sum / count;\ncout << avg;"], "e": "Вещественным должен стать операнд до деления; sum / count для целых даёт 3."}, {"l": 6, "k": "code", "q": "Какой фрагмент с составными операциями компилируется и выводит 1?", "o": ["int x = 20;\nx -= 5;\nx /= 3;\nx %= 4;\ncout << x;", "int x = 20;\nx -= 5;\nx =/ 3;\nx %= 4;\ncout << x;", "int x = 20;\nx -= 5;\nx /= 3;\nx % = 4;\ncout << x;", "int x = 20;\nx =- 5;\nx /= 3;\nx %= 4;\ncout << x;"], "e": "Составные операции пишут слитно и знаком операции вперёд: -=, /=, %=; запись =- присваивает минус пять."}, {"l": 6, "k": "out", "q": "Что выведет этот код?", "o": ["14 20", "20 20", "14 14", "20 14"], "e": "Умножение выполняется раньше сложения; скобки меняют порядок.", "c": "int a = 2 + 3 * 4;\nint b = (2 + 3) * 4;\ncout << a << \" \" << b;"}, {"l": 6, "k": "out", "q": "Что выведет этот код?", "o": ["2 3", "3 2", "2 3.4", "3.4 2"], "e": "Остаток 2, целая часть 3.", "c": "cout << 17 % 5 << \" \" << 17 / 5;"}, {"l": 6, "k": "out", "q": "Что выведет этот код?", "o": ["12", "12.5", "5", "13"], "e": "10 / 4 = 2 (целое деление), 10 + 2 = 12.", "c": "int x = 10;\nx = x + x / 4;\ncout << x;"}, {"l": 6, "k": "out", "q": "Что выведет этот код?", "o": ["8", "9", "4.5", "4"], "e": "9 / 2 = 4 (целые), d = 4.0, 4.0 * 2 = 8.", "c": "double d = 9 / 2;\ncout << d * 2;"}, {"l": 6, "k": "out", "q": "Что выведет этот код?", "o": ["5", "6", "4", "5.5"], "e": "5 / 2 = 2, 2 * 2 = 4, остаток 1, итого 5.", "c": "int a = 5, b = 2;\ncout << a / b * b + a % b;"}, {"l": 7, "k": "theory", "q": "Какой спецификатор формата используют для вывода одного символа?", "o": ["%c", "%s", "%d", "%f"], "e": "%c - символ, %s - строка, %d - целое, %f - вещественное."}, {"l": 7, "k": "theory", "q": "Какой спецификатор формата используют для вывода C-строки?", "o": ["%s", "%c", "%d", "%lf"], "e": "%s выводит строку до нулевого символа."}, {"l": 7, "k": "theory", "q": "Что возвращает функция scanf?", "o": ["Количество успешно считанных значений", "Последнее считанное значение", "Всегда 0", "Количество введённых символов"], "e": "Возвращаемое значение позволяет проверить, удался ли ввод."}, {"l": 7, "k": "theory", "q": "Что означает запись %5d в printf?", "o": ["Целое число в поле шириной 5 символов с выравниванием вправо", "Пять целых чисел подряд", "Целое число с пятью знаками после точки", "Число, умноженное на 5"], "e": "Число перед d - ширина поля."}, {"l": 7, "k": "theory", "q": "Какой заголовочный файл подключают для printf и scanf?", "o": ["<cstdio>", "<iostream>", "<string>", "<cmath>"], "e": "printf и scanf объявлены в <cstdio>."}, {"l": 7, "k": "code", "q": "Какой фрагмент компилируется и выводит 3 + 4 = 7?", "o": ["int a = 3, b = 4;\nprintf(\"%d + %d = %d\\n\", a, b, a + b);", "int a = 3, b = 4;\nprintf(\"%d + %d = %d\\n\", a + b, a, b);", "int a = 3, b = 4;\nprintf(\"%d + %d = %d\\n\" a, b, a + b);", "int a = 3, b = 4;\nprintf(%d + %d = %d\\n, a, b, a + b);"], "e": "Аргументы подставляются по порядку спецификаторов; после строки формата нужна запятая; строка формата пишется в кавычк \nelse printf(\"bad input\\n\");"], "e": "scanf возвращает количество считанных значений: при удачном вводе одного числа это 1, при неудаче 0; результат сравнивают с числом, а не со строкой."}, {"l": 7, "k": "code", "q": "Пользователь вводит 2.5 и 4. Какой фрагмент выводит площадь 10.00?", "o": ["double w, h;\nscanf(\"%lf %lf\", &w, &h);\nprintf(\"%.2f\\n\", w * h);", "double w, h;\nscanf(\"%f %f\", &w, &h);\nprintf(\"%.2f\\n\", w * h);", "double w, h;\nscanf(\"%lf %lf\", w, h);\nprintf(\"%.2f\\n\", w * h);", "double w, h;\nscanf(\"%lf %lf\", &w, &h);\nprintf(\"%.2f\\n\", w, h);"], "e": "Для double в scanf нужен %lf и адреса переменных; в printf один спецификатор - одно значение."}, {"l": 7, "k": "code", "q": "Пользователь вводит Ali 18. Какой фрагмент компилируется и выводит Ali is 18?", "o": ["char name[20];\nint age;\nscanf(\"%19s %d\", name, &age);\nprintf(\"%s is %d\\n\", name, age);", "char name[20];\nint age;\nscanf(\"%19s %d\", name, &age);\nprintf(\"%s is %d\\n\", age, name);", "char name[20];\nint age;\nscanf(\"%19s %d\", name, age);\nprintf(\"%s is %d\\n\", name, age);", "char name[20] int age;\nscanf(\"%19s %d\", name, &age);\nprintf(\"%s is %d\\n\", name, age);"], "e": "Порядок аргументов должен совпадать с порядком спецификаторов; для int в scanf нужен &; объявление заканчивается точкой с запятой."}, {"l": 7, "k": "code", "q": "Какой фрагмент компилируется и выводит Name: \"Ali\" вместе с кавычками?", "o": ["printf(\"Name: \\\"%s\\\"\\n\", \"Ali\");", "printf(\"Name: \"%s\"\\n\", \"Ali\");", "printf(\"Name: \\\"%s\\\"\\n\", Ali);", "printf(\"Name: /\"%s/\"\\n\", \"Ali\");"], "e": "Кавычки внутри строки формата пишут как \\\"; строковый аргумент тоже пишется в кавычках."}, {"l": 7, "k": "out", "q": "Что выведет этот код?", "o": ["   42|", "42   |", "00042|", "42|"], "e": "Ширина 5, выравнивание вправо: перед числом три пробела.", "c": "printf(\"%5d|\", 42);"}, {"l": 7, "k": "out", "q": "Что выведет этот код?", "o": ["003.1", "3.1", "03.14", "3.14159"], ], "e": "Операторы пишутся >= и <=; двойное неравенство сравнивает с 19 результат первого сравнения (0 или 1)."}, {"l": 8, "k": "code", "q": "Даны a = 3 и b = 5. Какой фрагмент компилируется и выводит different?", "o": ["int a = 3, b = 5;\nif (a != b) cout << \"different\";\nelse cout << \"same\";", "int a = 3, b = 5;\nif (a <> b) cout << \"different\";\nelse cout << \"same\";", "int a = 3, b = 5;\nif (a =! b) cout << \"different\";\nelse cout << \"same\";", "int a = 3, b = 5;\nif (a !== b) cout << \"different\";\nelse cout << \"same\";"], "e": "«Не равно» пишется !=; запись =! присваивает a значение !b."}, {"l": 8, "k": "code", "q": "Права выдают с 18 лет и только при наличии документа. Даны age = 20, hasId = false. Какой фрагмент компилируется и выводит no?", "o": ["int age = 20;\nbool hasId = false;\nif (age >= 18 && hasId) cout << \"yes\";\nelse cout << \"no\";", "int age = 20;\nbool hasId = false;\nif (age >= 18 || hasId) cout << \"yes\";\nelse cout << \"no\";", "int age = 20;\nbool hasId = false;\nif (age >= 18 && hasId = true) cout << \"yes\";\nelse cout << \"no\";", "int age = 20;\nbool hasId = \"false\";\nif (age >= 18 && hasId) cout << \"yes\";\nelse cout << \"no\";"], "e": "Оба условия должны выполняться (&&); строка \"false\" в кавычках - это не false, а ненулевой адрес, то есть true."}, {"l": 8, "k": "code", "q": "Какой фрагмент компилируется и правильно определяет, является ли введённый символ цифрой?", "o": ["char c;\ncin >> c;\nif (c >= '0' && c <= '9') cout << \"digit\";\nelse cout << \"other\";", "char c;\ncin >> c;\nif (c >= 0 && c <= 9) cout << \"digit\";\nelse cout << \"other\";", "char c;\ncin >> c;\nif (c >= \"0\" && c <= \"9\") cout << \"digit\";\nelse cout << \"other\";", "char c;\ncin >> c;\nif ('0' <= c <= '9') cout << \"digit\";\nelse cout << \"other\";"], "e": "Символы-цифры сравнивают с '0' и '9' в одинарных кавычках; числа 0 и 9 - это другие коды; двойное неравенство всегда истинно."}, {"l": 8, "k": "code", "q": "Даны a = 5, b = -1. Какой фрагмент компилируется и правильно проверяет, что НЕ оба числа положительные (выводит not both)?", "o": ["int a = 5, b = -1;\nif (!(a > 0 && b > 0)) cout << \"not both\";\nelse cout << \"both\";", "int a = 5, b = -1;\nif (!(a > 0) && !(b > 0)) cout << \"not both\";\nelse cout << \"both\";", "int a = 5, b = -1;\nif (!a > 0 && b > 0) cout << \"not both\";\nelse cout << \"both\";", "int a = 5, b = -1;\nif (!(a > 0 && b > 0) cout << \"not both\"; else cout << \"both\";"], "e": "По закону де Моргана !(A && B) равно !A || !B, а не !A && !B; отрицание всего условия требует скобок."}, {"l": 8, "k": "code", "q": "Какой фрагмент компилируется и выводит строку, которая идёт раньше по алфавиту (apple)?", "o": ["string a = \"apple\", b = \"banana\";\nif (a < b) cout << a;\nelse cout << b;", "string a = \"apple\", b = \"banana\";\nif (a - b < 0) cout << a;\nelse cout << b;", "string a = \"apple\", b = \"banana\";\nif (a > b) cout << a;\nelse cout << b;", "string a = 'apple', b = 'banana';\nif (a < b) cout << a;\nelse cout << b;"], "e": "Строки string сравнивают операторами < и >; вычитать строки нельзя; строки пишут в двойных кавычках."}, {"l": 8, "k": "code", "q": "Даны a = 0, b = 10. Какой фрагмент безопасен при a = 0 и выводит skip?", "o": ["int a = 0, b = 10;\nif (a != 0 && b / a > 2) cout << \"big\";\nelse cout << \"skip\";", "int a = 0, b = 10;\nif (b / a > 2 && a != 0) cout << \"big\";\nelse cout << \"skip\";", "int a = 0, b = 10;\nif (a != 0 & b / a > 2) cout << \"big\";\nelse cout << \"skip\";", "int a = 0, b = 10;\nif (a != 0 || b / a > 2) cout << \"big\";\nelse cout << \"skip\";"], "e": "Проверка a != 0 должна стоять первой и соединяться через &&: тогда при a = 0 деление не выполняется. Одиночный & и || вычисляют деление на ноль."}, {"l": 8, "k": "out", "q": "Что выведет этот код?", "o": ["100", "101", "truefalsefalse", "110"], "e": "true выводится как 1, false как 0.", "c": "cout << (5 > 3) << (2 == 3) << (4 != 4);"}, {"l": 8, "k": "out", "q": "Что выведет этот код?", "o": ["01", "10", "11", "00"], "e": "5 не лежит между 1 и 4, но 5 > 4.", "c": "int x = 5;\ncout << (x > 1 && x < 4) << (x < 1 || x > 4);"}, {"l": 8, "k": "out", "q": "Что выведет этот код?", "o": ["01", "10", "00", "11"], "e": "!a = false, b = false, поэтому 0; a && b = false, отрицание даёт 1.", "c": "bool a = true, b = false;\ncout << (!a || b) << (!(a && b));"}, {"l": 8, "k": "out", "q": "Что выведет этот код?", "o": ["A5", "B0", "A0", "B5"], "e": "x = 5 - присваивание: x становится 5, условие истинно.", "c": "int x = 0;\nif (x = 5) cout << \"A\";\nelse cout << \"B\";\ncout << x;"}, {"l": 8, "k": "out", "q": "Что выведет этот код?", "o": ["110", "100", "111", "010"], "e": "Символы сравниваются по кодам: прописные буквы идут раньше строчных.", "c": "cout << ('a' < 'b') << ('A' < 'a') << ('9' < '1');"}, {"l": 8, "k": "out", "q": "Что выведет этот код?", "o": ["11", "10", "01", "00"], "e": "1 < a даёт 1, затем 1 < 3 истинно, хотя a не меньше 3.", "c": "int a = 3;\ncout << (a > 1 == true) << (1 < a < 3);"}, {"l": 9, "k": "theory", "q": "К какому if относится else, если фигурных скобок нет?", "o": ["К ближайшему предыдущему if", "К самому первому if", "Ко всем if сразу", "Это ошибка компиляции"], "e": "Чтобы изменить привязку, используют фигурные скобки."}, {"l": 9, "k": "theory", "q": "Каким должно быть значение в метке case?", "o": ["Константой", "Переменной", "Условием со знаком сравнения", "Строкой string"], "e": "Метки case - целочисленные или символьные константы."}, {"l": 9, "k": "theory", "q": "Когда выполняется ветвь default в switch?", "o": ["Когда ни одна метка case не совпала", "Всегда первой", "Всегда последней, после любой ветви", "Только при ошибке"], "e": "default - вариант «во всех остальных случаях»."}, {"l": 9, "k": "theory", "q": "Сколько ветвей выполнится в цепочке if - else if - else?", "o": ["Ровно одна", "Все, условия которых истинны", "Ни одной", "Всегда две"], "e": "После первой сработавшей ветви остальные пропускаются."}, {"l": 9, "k": "code", "q": "Дано x = 5. Какой фрагмент компилируется и выводит только plus?", "o": ["int x = 5;\nif (x > 0) cout << \"plus\";\nelse if (x < 0) cout << \"minus\";\nelse cout << \"zero\";", "int x = 5;\nif (x > 0) cout << \"plus\";\nelseif (x < 0) cout << \"minus\";\nelse cout << \"zero\";", "int x = 5;\nif (x > 0) cout << \"plus\";\nelse (x < 0) cout << \"minus\";\nelse cout << \"zero\";", "int x = 5;\nif (x > 0) cout << \"plus\";\nif (x < 0) cout << \"minus\";\nelse cout << \"zero\";"], "e": "else if пишется двумя словами; после else условие без if недопустимо; без else второй if проверяется отдельно, и выводится pluszero."}, {"l": 9, "k": "code", "q": "Дано m = 1 (номер месяца). Какой фрагмент компилируется и выводит только winter?", "o": ["int m = 1;\nswitch (m) {\n    case 12: case 1: case 2: cout << \"winter\";\n    break;\n    case 3: case 4: case 5: cout << \"spring\";\n    break;\n    default: cout << \"other\";\n}", "int m = 1;\nswitch (m) {\n    case 12, 1, 2: cout << \"winter\";\n    break;\n    case 3: case 4: case 5: cout << \"spring\";\n    break;\n    default: cout << \"other\";\n}", "int m = 1;\nswitch (m) {\n    case 12: case 1: case 2: cout << \"winter\";\n    case 3: case 4: case 5: cout << \"spring\";\n    break;\n    default: cout << \"other\";\n}", "int m = 1;\nswitch (m) {\n    case 12: case 1: case 2: cout << \"winter\";\n    break;\n    case 3: case 4: case 5: cout << \"spring\";\n    break;\n    else: cout << \"other\";\n}"], "e": "Несколько значений записывают отдельными метками case; без break выполнение проваливается в spring; ветвь «иначе» в switch называется default."}, {"l": 9, "k": "code", "q": "Дано c = 'e'. Какой фрагмент компилируется и выводит только vowel?", "o": ["char c = 'e';\nswitch (c) {\n    case 'a': case 'e': case 'i': case 'o': case 'u': cout << \"vowel\";\n    break;\n    default: cout << \"consonant\";\n}", "char c = 'e';\nswitch (c) {\n    case 'a': case \"e\": case 'i': case 'o': case 'u': cout << \"vowel\";\n    break;\n    default: cout << \"consonant\";\n}", "char c = 'e';\nswitch (c) {\n    case 'a' || 'e': case 'i': case 'o': case 'u': cout << \"vowel\";\n    break;\n    default: cout << \"consonant\";\n}", "char c = 'e';\nswitch (c) {\n    case 'a': case 'e': case 'i': case 'o': case 'u': cout << \"vowel\";\n    default: cout << \"consonant\";\n}"], "e": "Метки для char - в одинарных кавычках; 'a' || 'e' - это логическое выражение, равное 1; без break выполнится и default."}, {"l": 9, "k": "code", "q": "Дано age = 5. Билет: до 7 лет бесплатно, до 60 лет 100, иначе 50. Какой фрагмент компилируется и выводит 0?", "o": ["int age = 5;\nint price;\nif (age < 7) price = 0;\nelse if (age < 60) price = 100;\nelse price = 50;\ncout << price;", "int age = 5;\nint price;\nif (age < 7) price = 0;\nif (age < 60) price = 100;\nelse price = 50;\ncout << price;", "int age = 5;\nint price;\nif (age < 7) price = 0;\nelse if (age < 60) price = 100;\nprice = 50;\ncout << price;", "int age = 5;\nif (age < 7) price = 0;\nelse if (age < 60) price = 100;\nelse price = 50;\ncout << price;"], "e": "Без else второе условие проверяется заново и заменяет цену; без последнего else цена всегда 50; переменную нужно объявить."}, {"l": 9, "k": "code", "q": "Какой фрагмент со switch компилируется?", "o": ["int n = 2;\nswitch (n) {\n    case 1: cout << \"one\";\n    break;\n    case 2: cout << \"two\";\n    break;\n}", "int n = 2;\nswitch (n) {\n    case 1: cout << \"one\";\n    break;\n    case 1:  cout << \"two\";\n    break;\n}", "int n = 2;\nswitch (n) {\n    case 1: cout << \"one\";\n    break;\n    case n: cout << \"two\";\n    break;\n}", "int n = 2;\nswitch (n) {\n    case 1: cout << \"one\";\n    break;\n    case 2: cout << \"two\";\n    break\n}"], "e": "Метки case не должны повторяться и должны быть константами; после break нужна точка с запятой."}, {"l": 9, "k": "code", "q": "Дано score = 85. Какой фрагмент компилируется и выводит B (90-100 - A, 80-89 - B, иначе C)?", "o": ["int score = 85;\nswitch (score / 10) {\n    case 10: case 9: cout << \"A\";\n    break;\n    case 8: cout << \"B\";\n    break;\n    default: cout << \"C\";\n}", "int score = 85;\nswitch (score) {\n    case 10: case 9: cout << \"A\";\n    break;\n    case 8: cout << \"B\";\n    break;\n    default: cout << \"C\";\n}", "int score = 85;\nswitch (score / 10) {\n    case 10: case 9: cout << \"A\";\n    break;\n    case 80..89: cout << \"B\";\n    break;\n    default: cout << \"C\";\n}", "int score = 85;\nswitch (score / 10) {\n    case 10: case 9: cout << \"A\";\n    break;\n    case >= 8: cout << \"B\";\n    break;\n    default: cout << \"C\";\n}"], "e": "switch не умеет проверять диапазоны: баллы делят на 10 и сравнивают десятки с константами."}, {"l": 9, "k": "code", "q": "Даны t = 30, rain = false. Какой фрагмент компилируется и при этих данных ничего не выводит?", "o": ["int t = 30;\nbool rain = false;\nif (t > 25) {\n    if (rain) cout << \"umbrella\";\n} else {\n    cout << \"coat\";\n}", "int t = 30;\nbool rain = false;\nif (t > 25) if (rain) cout << \"umbrella\";\nelse cout << \"coat\";", "int t = 30;\nbool rain = false;\nif (t > 25) {\n    if rain cout << \"umbrella\";\n} else {\n    cout << \"coat\";\n}", "int t = 30;\nbool rain = false;\nif (t > 25) {\n    if (rain) cout << \"umbrella\";\n};\nelse {\n    cout << \"coat\";\n}"], "e": "Без фигурных скобок else относится к ближайшему if (rain), и выводится coat; условие пишут в скобках; ; перед else отрывает его от if."}, {"l": 9, "k": "code", "q": "Даны a = 4, b = 9. Какой фрагмент компилируется и выводит меньшее число (4)?", "o": ["int a = 4, b = 9;\nint mn;\nif (a < b) mn = a;\nelse mn = b;\ncout << mn;", "int a = 4, b = 9;\nint mn;\nif (a < b) mn = a;\nmn = b;\ncout << mn;", "int a = 4, b = 9;\nint mn;\nif (a < b) mn = a else mn = b;\ncout << mn;", "int a = 4, b = 9;\nint mn;\nif (a < b) mn == a;\nelse mn == b;\ncout << mn;"], "e": "Без else значение mn всегда заменяется на b; перед else нужна ; оператор == сравнивает, а не танет положительным (выводит 8)?", "o": ["int n;\nagain: cin >> n;\nif (n <= 0) goto again;\ncout << n;", "int n;\nagain: cin >> n;\nif (n <= 0) goto again cout << n;", "int n;\nagain cin >> n;\nif (n <= 0) goto again;\ncout << n;", "int n;\nagain: cin >> n;\nif (n > 0) goto again;\ncout << n;"], "e": "После goto нужна ; метка пишется с двоеточием; повторять ввод нужно при неположительном числе."}, {"l": 12, "k": "code", "q": "Пользователь вводит делители 5 0 4. Какой фрагмент пропускает деление на ноль и выводит 20 skip 25?", "o": ["for (int i = 0; i < 3; i++) {\n    int d;\n    cin >> d;\n    if (d == 0) {\n        cout << \"skip \";\n        continue;\n    }\n    cout << 100 / d << \" \";\n}", "for (int i = 0; i < 3; i++) {\n    int d;\n    cin >> d;\n    if (d == 0) {\n        cout << \"skip \";\n    }\n    cout << 100 / d << \" \";\n}", "for (int i = 0; i < 3; i++) {\n    int d;\n    cin >> d;\n    if (d == 0) {\n        cout << \"skip \";\n        break;\n    }\n    cout << 100 / d << \" \";\n}", "for (int i = 0; i < 3; i++) {\n    int d;\n    cin >> d;\n    if (d = 0) {\n        cout << \"skip \";\n        continue;\n    }\n    cout << 100 / d << \" \";\n}"], "e": "Без continue деление на ноль всё равно выполнится; break прекращает обработку остальных чисел; d = 0 - присваивание."}, {"l": 12, "k": "code", "q": "Пользователь вводит 5 3 8 0 4. Какой фрагмент выводит количество чисел до первого нуля (3)?", "o": ["int x, cnt = 0;\nwhile (cin >> x) {\n    if (x == 0) break;\n    cnt++;\n}\ncout << cnt;", "int x, cnt = 0;\nwhile (cin >> x) {\n    cnt++;\n    if (x == 0) break;\n}\ncout << cnt;", "int x, cnt = 0;\nwhile (cin >> x) {\n    if (x == 0) continue;\n    cnt++;\n}\ncout << cnt;", "int x, cnt = 0;\nwhile (cin >> x) {\n    if (x != 0) break;\n    cnt++;\n}\ncout << cnt;"], "e": "Проверка на ноль должна стоять до увеличения счётчика; continue не прекращает подсчёт."}, {"l": 12, "k": "code", "q": "Какой фрагмент компилируется и выводит строку без пробелов (abc
